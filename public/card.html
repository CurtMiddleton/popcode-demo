        $('back-clear').addEventListener('click', () => { state.back = null; drawBackPreview(true); });
        $('see-back').addEventListener('click', (e) => { e.preventDefault(); showSide('back'); $('ed-stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
        $('side-toggle').addEventListener('click', (e) => { const b = e.target.closest('[data-side]'); if (b) showSide(b.dataset.side); });
        // Editing the words is front work: show the front.
        $('zone-fields').addEventListener('focusin', () => { if (state.side === 'back') showSide('front'); });
        drawBackPreview();
        $('card-name').addEventListener('input', (e) => { state.name = e.target.value; });
        // The Popcode link, as on the calendar and books: fills in from the
        // name until the buyer edits it; locked once the card is saved.
        slugField = PopcodeSlug.attach({
          db, nameInput: $('card-name'), slugInput: $('slug-input'), note: $('slug-note'),
          classes: { base: 'slug-note', err: 'bad' }, nameLabel: 'name', touched: state.slugTouched,
          onChange: (sl) => {
            state.slug = sl;
            clearTimeout(slugBackTimer);
            if (state.side === 'back') slugBackTimer = setTimeout(() => drawBackPreview(true), 300);
          },
        });
        $('slug-input').addEventListener('input', () => { state.slugTouched = true; });
        if (editing) slugField.lock(editing.slug, 'This card’s link. It’s locked so printed cards keep working.');
        else if (state.slug) slugField.set(state.slug, state.slugTouched);
        else if (state.name) slugField.set(PopcodeSlug.slugify(state.name), false);
        if ($('move-reset')) {
          $('move-reset').addEventListener('click', (e) => { e.preventDefault(); state.moves = {}; drawEditorCard(); paintMoveReset(); });
          paintMoveReset();
        }
        $('save-btn').addEventListener('click', onSave);
        $('cart-btn').addEventListener('click', addToCart);
      }

      // Orientation, greeting and corners: Minted's product options.
      function optionRow(rowId, nameId, items, current, onPick) {
        const row = $(rowId);
        row.innerHTML = '';
        items.forEach((it) => {
          const b = document.createElement('button');
          b.className = (row.classList.contains('chip-row') ? 'occ-chip' : 'pack-btn') + (it.id === current ? ' active' : '');
          b.textContent = it.label;
          b.addEventListener('click', () => onPick(it.id));
          row.appendChild(b);
        });
        const cur = items.find((it) => it.id === current);
        $(nameId).textContent = cur ? cur.label : '';
      }
      function renderOptions() {
        const tpl = state.template;
        $('opt-layout').classList.toggle('hidden', !state.custom);
        if (state.custom) {
          optionRow('layout-row', 'layout-name', C.CARD_LAYOUTS, state.custom.layout, (id) => {
            state.custom.layout = id; relayoutBoxes(); state.template = customTemplate(); renderEditor();
          });
        }
        const fam = state.custom
          ? [{ orientation: 'portrait' }, { orientation: 'landscape' }]
          : C.familyTemplates(tpl.family);
        $('opt-orient').classList.toggle('hidden', fam.length < 2);
        if (fam.length > 1) {
          optionRow('orient-row', 'orient-name',
            fam.map((t) => ({ id: t.orientation, label: t.orientation === 'portrait' ? 'Portrait' : 'Landscape' })),
            tpl.orientation, (o) => switchOrientation(o));
        }
        const greets = (tpl.text || []).some((z) => z.greet);
        $('opt-greet').classList.toggle('hidden', !greets);
        if (greets) {
          optionRow('greet-row', 'greet-name', C.GREETINGS, state.greeting, (id) => {
            state.greeting = id;
            // A new greeting replaces what the greeting lines say, typed or not.
            (state.template.text || []).forEach((z) => { if (z.greet) delete state.text[z.id]; });
            renderOptions(); drawEditorCard(); renderZoneFields();
          });
        }
        const scripted = (tpl.text || []).some((z) => z.scriptable);
        $('opt-script').classList.toggle('hidden', !scripted);
        if (scripted) {
          const own = (tpl.text.find((z) => z.scriptable) || {}).font;
          optionRow('script-row', 'script-name', C.SCRIPTS, state.script || own, (id) => { state.script = id; renderOptions(); drawEditorCard(); });
          // Each button is set in its own script so the choice is visible.
          [...$('script-row').children].forEach((b, i) => { b.style.fontFamily = C.FONTS[C.SCRIPTS[i].id].css; b.style.fontSize = '22px'; b.style.fontWeight = '400'; b.style.lineHeight = '1.1'; });
        }
        optionRow('corner-row', 'corner-name', [{ id: 'square', label: 'Square' }, { id: 'rounded', label: 'Rounded' }],
          state.corners, (c) => { state.corners = c; renderOptions(); drawEditorCard(); });
      }
      // Same design, the other layout. Words, photos and colour carry over.
      function switchOrientation(o) {
        if (state.custom) {
          if (state.custom.orientation === o) return;
          state.custom.orientation = o; relayoutBoxes(); state.template = customTemplate(); renderEditor();
          return;
        }
        const next = C.familyTemplates(state.template.family).find((t) => t.orientation === o);
        if (!next || next === state.template) return;
        state.template = next;
        state.moves = {};   // positions belong to one layout
        if (!(next.colorways || []).includes(state.colorway)) state.colorway = next.colorways[0];
        renderEditor();
      }

      function renderColorways() {
        const tpl = state.template;
        const row = $('cw-row');
        const list = tpl.colorways || [C.DEFAULT_COLORWAY];
        $('cw-name').textContent = (C.COLORWAYS[state.colorway] || {}).label || '';
        if (list.length < 2) { $('cw-panel').classList.add('hidden'); return; }
        row.innerHTML = '';
        list.forEach((id) => {
          const c = C.COLORWAYS[id]; if (!c) return;
          const dot = document.createElement('button');
          dot.className = 'sw sw-lg' + (id === state.colorway ? ' active' : '');
          dot.style.background = c.ground;
          dot.title = c.label;
          dot.addEventListener('click', () => { state.colorway = id; renderColorways(); drawEditorCard(); });
          row.appendChild(dot);
        });
      }

      // Front / Back under the preview, like the ornament's. Changing anything
      // on the front (an option, a photo) brings the front back.
      function showSide(side) {
        if (side === 'back') drawBackPreview(true); else drawEditorCard();
      }
      function paintSideToggle() {
        document.querySelectorAll('#side-toggle [data-side]').forEach((b) =>
          b.classList.toggle('active', b.dataset.side === (state.side || 'front')));
        paintPhotoLinks();
      }
      // Under the preview: change / remove the photo on the side showing.
      function paintPhotoLinks() {
        const h = $('side-hint');
        if (!h) return;
        const link = (id, label) => '<a href="#" data-act="' + id + '">' + label + '</a>';
        const slots = (state.template.photos || []).filter((sl) => state.photos[sl.id]);
        if (state.side === 'back') {
          h.innerHTML = state.back
            ? link('back-change', 'Change photo') + ' &middot; ' + link('back-remove', 'Remove photo')
            : link('back-change', 'Add a photo') + ' above the message';
        } else if (!slots.length) {
          h.innerHTML = link('front-add', 'Add your photo') + (state.template.photos.length > 1 ? ' &middot; or tap any photo spot' : '');
        } else if (state.template.photos.length === 1) {
          h.innerHTML = link('front-edit', 'Edit photo') + ' &middot; ' + link('front-remove', 'Remove photo');
        } else {
          h.innerHTML = 'Tap a photo to edit it &middot; ' + link('front-remove', 'Remove all photos');
        }
        h.onclick = (e) => {
          const a = e.target.closest('[data-act]');
          if (!a) return;
          e.preventDefault();
          const act = a.dataset.act;
          if (act === 'back-change') { pendingSlot = '__back'; $('photo-input').click(); }
          if (act === 'back-remove') { state.back = null; drawBackPreview(true); }
          if (act === 'front-edit') onPhotoTap(state.template.photos[0].id);
          if (act === 'front-add') pickPhotoFor(state.template.photos[0].id);
          if (act === 'front-remove') { state.photos = {}; drawEditorCard(); }
        };
      }
      function editorCardWidth() {
        const stage = $('ed-stage');
        const side = stage.clientWidth || Math.min(460, window.innerWidth - 40);
        const fmt = C.CARD_FORMATS[state.template.formatId];
        return Math.round(state.template.orientation === 'landscape' ? side * 0.96 : side * 0.92 * fmt.aspect);
      }
      function drawEditorCard() {
        state.side = 'front';
        paintSideToggle();
        const stage = $('ed-stage');
        stage.innerHTML = '';
        const land = state.template.orientation === 'landscape';
        const w = editorCardWidth();
        // Sample photos for the empty slots: the tile's photo first, then others.
        state.samples = state.samples || {};
        const pool = window.unsplashSamples ? window.unsplashSamples(6, 900) : [];
        (state.template.photos || []).forEach((sl, i) => {
          if (!state.samples[sl.id]) state.samples[sl.id] = (i === 0 && state.sampleUrl) || pool[i] || '/assets/sample-photo.jpg';
        });
        const face = renderCard(state.template, {
          width: w, editable: !state.custom, samples: state.samples, text: state.text, photos: state.photos, bw: state.bw,
          greeting: state.greeting, corners: state.corners, script: state.script, moves: state.moves,
          colorway: state.colorway, onPickPhoto: onPhotoTap,
        });
        stage.appendChild(face);
        fitCardText(face);
        if (state.custom) enableDrag(face); else enableZoneDrag(face);
      }

      // Side inputs and on-card editing are two views of the same string.
      function renderZoneFields() {
        const host = $('zone-fields');
        host.innerHTML = '';
        C.resolveText(state.template, state.text, state.greeting).forEach((z) => {
          const role = C.TEXT_ROLES[z.role] || {};
          const f = document.createElement('div');
          f.className = 'field';
          f.innerHTML =
            '<label for="zf-' + z.id + '">' + esc(z.label || role.label || z.id) +
            '<span class="lim" id="lim-' + z.id + '"></span></label>' +
            '<input class="text-input" id="zf-' + z.id + '" maxlength="' + (role.maxChars || 120) +
            '" value="' + esc(z.value) + '" placeholder="' + esc(role.hint || '') + '"/>';
          host.appendChild(f);
          const input = f.querySelector('input');
          input.addEventListener('input', () => {
            state.text[z.id] = input.value;
            const el = $('ed-stage').querySelector('[data-zone="' + z.id + '"]');
            if (el) {
              el.textContent = input.value;
              el.classList.toggle('placeholder', !input.value);
              const f = el.closest('.card-face');
              if (f) fitCardText(f);
            }
            updateLimit(z.id, input.value.length, role.maxChars || 120);
          });
          updateLimit(z.id, z.value.length, role.maxChars || 120);
        });
      }
      function updateLimit(id, len, max) {
        const el = $('lim-' + id);
        if (el) el.textContent = len > max - 8 ? len + '/' + max : '';
      }
      // On-card typing → mirror into the side inputs.
      function syncSideInputs() {
        C.resolveText(state.template, state.text, state.greeting).forEach((z) => {
          const input = $('zf-' + z.id);
          if (input && input.value !== z.value) input.value = z.value;
          updateLimit(z.id, z.value.length, (C.TEXT_ROLES[z.role] || {}).maxChars || 120);
        });
      }

      // `state.pack` is the number of cards; C.packFor turns it into a
      // Printify pack and a number of copies at the cart.
      function renderPacks() {
        const sel = $('qty-select');
        sel.innerHTML = C.CARD_QUANTITIES.map((q) =>
          '<option value="' + q + '"' + (q === state.pack ? ' selected' : '') + '>' + q + ' cards</option>').join('');
        sel.onchange = () => { state.pack = Number(sel.value); refreshPrice(); };
        refreshPrice();
      }

      // Price comes from the server (never computed here — the client is not
      // trusted for money). Until the Printify card SKU is pinned down the quote
      // endpoint has nothing to price, so we show a placeholder rather than a
      // number we'd have to walk back.
      async function refreshPrice() {
        $('price-big').textContent = '—';
        $('price-note').textContent = state.pack + ' cards · price shown in your cart';
      }

      function updatePopHint() {
        const pc = state.popcode;
        $('pop-hint').textContent = pc
          ? (pc.mediaType === 'audio' ? 'Audio added.' : 'Video added.') + ' Scanning the printed card plays it.'
          : 'Add a Popcode and the card comes to life: point a phone at it and your video, montage or audio plays.';
        $('pop-label').textContent = pc ? 'Edit Popcode' : 'Add a Popcode';
        $('pop-btn').classList.toggle('has-media', !!pc);
      }

      // Tap an empty photo to add one; tap a photo to edit it (the calendar's
      // Edit Photo: fill or fit, zoom, drag, rotate, replace, remove).
      function onPhotoTap(slotId) {
        if (!state.photos[slotId]) { pickPhotoFor(slotId); return; }
        const slot = state.template.photos.find((p) => p.id === slotId);
        const fmt = C.CARD_FORMATS[state.template.formatId];
        const land = state.template.orientation === 'landscape';
        const W = land ? fmt.hIn : fmt.wIn, H = land ? fmt.wIn : fmt.hIn;
        const p = state.photos[slotId];
        PopcodeTools.editPhoto({
          url: p.url, adjust: p.adjust, aspect: (slot.w * W) / (slot.h * H),
          source: p.file ? 'Device' : 'Saved',
          onSave: (a) => { p.adjust = a; drawEditorCard(); },
          onReplace: (f) => {
            const url = URL.createObjectURL(f);
            state.photos[slotId] = { file: f, url };
            drawEditorCard();
            return url;
          },
          onRemove: () => { delete state.photos[slotId]; drawEditorCard(); },
        });
      }

      // A small live picture of the back, from the same renderer as the print.
      let backSeq = 0;
      // The back, drawn the same size as the front in the main preview
      // (`show`), from the same renderBack the print file uses. Tapping it
      // adds or changes the back photo.
      async function drawBackPreview(show) {
        const mine = ++backSeq;
        $('back-photo').textContent = state.back ? 'Change photo' : 'Add a photo';
        $('back-clear').classList.toggle('hidden', !state.back);
        $('opt-bshape').classList.toggle('hidden', !state.back);
        $('opt-bsize').classList.toggle('hidden', !state.back);
        if (state.back) {
          optionRow('bsize-row', 'bsize-name',
            [{ id: 'small', label: 'Small' }, { id: 'medium', label: 'Medium' }, { id: 'large', label: 'Large' }],
            state.back.size || 'large', (id) => { state.back.size = id; drawBackPreview(true); });
        }
        if (state.back) {
          let natural = null;
          try { natural = await loadImg(state.back.url); } catch (_) {}
          if (mine !== backSeq) return;
          optionRow('bshape-row', 'bshape-name',
            [{ id: 'landscape', label: 'Landscape' }, { id: 'portrait', label: 'Portrait' }, { id: 'square', label: 'Square' }],
            backShape(natural), (id) => { state.back.shape = id; drawBackPreview(true); });
        }
        if (!show) return;
        state.side = 'back';
        paintSideToggle();
        const full = await renderBack(editing ? editing.slug : ((slugField && slugField.get()) || 'yourlink'), { placeholder: true });
        if (mine !== backSeq || state.side !== 'back' || !$('ed-stage')) return;
        const w = editorCardWidth();
        const im = document.createElement('img');
        im.className = 'ed-back';
        im.alt = 'The back of the card';
        im.src = full.toDataURL('image/jpeg', 0.9);
        im.style.width = w + 'px';
        im.style.borderRadius = state.corners === 'rounded' ? (w * 0.035) + 'px' : '0';
        im.addEventListener('click', () => { pendingSlot = '__back'; $('photo-input').click(); });
        const stage = $('ed-stage');
        stage.innerHTML = '';
        stage.appendChild(im);
      }

      // ── Photos ──────────────────────────────────────────────────────────
      let pendingSlot = null;
      function pickPhotoFor(slotId) {
        pendingSlot = slotId;
        $('photo-input').click();
      }
      $('photo-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file || !pendingSlot) return;
        if (pendingSlot === '__browse') {
          state.myPhoto = { file, url: URL.createObjectURL(file) };
          pendingSlot = null;
          renderBrowse();
          return;
        }
        if (pendingSlot === '__back') {
          state.back = { file, url: URL.createObjectURL(file) };
          pendingSlot = null;
          drawBackPreview(true);
          return;
        }
        state.photos[pendingSlot] = { file, url: URL.createObjectURL(file) };
        pendingSlot = null;
        drawEditorCard();
      });

      // ── Print files ─────────────────────────────────────────────────────
      // The front is captured from renderCard() itself, so the print can't drift
      // from the editor. html2canvas 1.4.1 (cdnjs), the library postcard-render.js
      // and calendar.html already print with. It reads computed styles, so the
      // cq-unit type sizes arrive as pixels. The two things it can't draw are
      // handled around it:
      //   - object-fit:cover <img>: each photo is pre-cropped onto a <canvas>
      //   - background-clip:text (foil): hidden for the capture, painted after
      const FRONT_CSS_W = 750;   // captured at x2 = 1500px = 5in at 300 DPI
      let h2cPromise = null;
      function loadHtml2canvas() {
        if (window.html2canvas) return Promise.resolve();
        if (h2cPromise) return h2cPromise;
        h2cPromise = new Promise((res, rej) => {
          const el = document.createElement('script');
          el.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          el.onload = res;
          el.onerror = () => rej(new Error('Could not load the print renderer. Check your connection and try again.'));
          document.head.appendChild(el);
        }).catch((e) => { h2cPromise = null; throw e; });
        return h2cPromise;
      }
      function loadImg(src) {
        return new Promise((res, rej) => {
          const i = new Image(); i.crossOrigin = 'anonymous';
          i.onload = () => res(i); i.onerror = () => rej(new Error('Could not load ' + src)); i.src = src;
        });
      }
      // Clip to an element's border-radius (each corner may be elliptical, as the
      // arch is). html2canvas doesn't clip a child canvas to its parent's radius.
      function clipToRadius(ctx, el, w, h, scale) {
        const cs = getComputedStyle(el);
        const corner = (v) => {
          const [a, b] = v.split(' ').map((x) => parseFloat(x) || 0);
          return [a * scale, (b == null || isNaN(b) ? a : b) * scale];
        };
        const fit = (r) => [Math.min(r[0], w / 2), Math.min(r[1], h / 2)];
        const tl = fit(corner(cs.borderTopLeftRadius)), tr = fit(corner(cs.borderTopRightRadius));
        const br = fit(corner(cs.borderBottomRightRadius)), bl = fit(corner(cs.borderBottomLeftRadius));
        ctx.beginPath();
        ctx.moveTo(tl[0], 0);
        ctx.lineTo(w - tr[0], 0);
        ctx.ellipse(w - tr[0], tr[1], tr[0], tr[1], 0, -Math.PI / 2, 0);
        ctx.lineTo(w, h - br[1]);
        ctx.ellipse(w - br[0], h - br[1], br[0], br[1], 0, 0, Math.PI / 2);
        ctx.lineTo(bl[0], h);
        ctx.ellipse(bl[0], h - bl[1], bl[0], bl[1], 0, Math.PI / 2, Math.PI);
        ctx.lineTo(0, tl[1]);
        ctx.ellipse(tl[0], tl[1], tl[0], tl[1], 0, Math.PI, Math.PI * 1.5);
        ctx.closePath();
        ctx.clip();
      }
      function drawCover(ctx, img, w, h) {
        const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
        const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }

      // A CSS linear-gradient(<deg>, colour p%, ...) as a canvas gradient over a
      // box. Read back from the DOM the colours come as rgb(), not the hex in
      // cards.mjs, so both are accepted.
      function cssGradient(ctx, css, x, y, w, h) {
        const deg = parseFloat((css.match(/\(\s*(-?[\d.]+)deg/) || [0, 180])[1]);
        const a = deg * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a);
        const len = Math.abs(w * dx) + Math.abs(h * dy);
        const cx = x + w / 2, cy = y + h / 2;
        const g = ctx.createLinearGradient(cx - dx * len / 2, cy - dy * len / 2, cx + dx * len / 2, cy + dy * len / 2);
        for (const m of css.matchAll(/(rgba?\([^)]*\)|#[0-9a-f]{3,8})\s+([\d.]+)%/gi)) g.addColorStop(parseFloat(m[2]) / 100, m[1]);
        return g;
      }

      // Paint one foil zone glyph by glyph at the positions the browser laid it
      // out at, so wrapping, tracking and alignment match the editor exactly.
      function paintFoil(ctx, el, origin, scale, faceH) {
        const cs = getComputedStyle(el);
        const fs = parseFloat(cs.fontSize);
        const font = `${cs.fontStyle} ${cs.fontWeight} ${fs * scale}px ${cs.fontFamily}`;
        ctx.save();
        ctx.font = font;
        const asc = ctx.measureText('Hg').fontBoundingBoxAscent;
        const box = el.getBoundingClientRect();
        ctx.fillStyle = cssGradient(ctx, el.style.backgroundImage,
          (box.left - origin.left) * scale, (box.top - origin.top) * scale, box.width * scale, box.height * scale);
        // The editor's drop-shadow(0 0.35cqh 0.5cqh rgba(0,0,0,0.16)).
        ctx.shadowColor = 'rgba(0,0,0,0.16)';
        ctx.shadowOffsetY = 0.0035 * faceH * scale;
        ctx.shadowBlur = 0.005 * faceH * scale;
        ctx.textBaseline = 'alphabetic';
        const upper = cs.textTransform === 'uppercase';
        const range = document.createRange();
        for (const node of el.childNodes) {
          if (node.nodeType !== 3) continue;
          const text = node.textContent;
          for (let i = 0; i < text.length; i++) {
            if (/\s/.test(text[i])) continue;
            range.setStart(node, i); range.setEnd(node, i + 1);
            const r = range.getClientRects()[0];
            if (!r) continue;
            ctx.fillText(upper ? text[i].toUpperCase() : text[i],
              (r.left - origin.left) * scale, (r.top - origin.top) * scale + asc);
          }
        }
        ctx.restore();
      }

      // The front at trim size (1500 x 2100 for a 5x7), exactly as the editor shows it.
      async function renderFrontTrim() {
        await loadHtml2canvas();
        const tpl = state.template;
        const trim = C.cardTrimSize(tpl.formatId, tpl.orientation);
        const holder = document.createElement('div');
        holder.style.cssText = 'position:fixed;left:-20000px;top:0;pointer-events:none;';
        const face = renderCard(tpl, { width: FRONT_CSS_W, text: state.text, photos: state.photos,
          colorway: state.colorway, crossOrigin: true, bw: state.bw, greeting: state.greeting, script: state.script,
          moves: state.custom ? null : state.moves });
        face.style.boxShadow = 'none';
        holder.appendChild(face);
        document.body.appendChild(holder);
        try {
          await document.fonts.ready;
          fitCardText(face);
          const scale = trim.w / face.offsetWidth;
          for (const box of face.querySelectorAll('.cf-photo')) {
            const im = box.querySelector('img');
            if (!im) continue;
            if (!im.complete || !im.naturalWidth) await im.decode().catch(() => {});
            if (!im.naturalWidth) throw new Error('A photo didn’t load. Try adding it again.');
            const r = box.getBoundingClientRect();
            const c = document.createElement('canvas');
            c.width = Math.round(r.width * scale); c.height = Math.round(r.height * scale);
            const cx = c.getContext('2d');
            cx.imageSmoothingQuality = 'high';
            clipToRadius(cx, box, c.width, c.height, scale);
            const adj = (state.photos[box.dataset.slot] || {}).adjust;
            if (adj) PopcodeTools.drawPhotoAdjusted(cx, im, adj, 0, 0, c.width, c.height);
            else drawCover(cx, im, c.width, c.height);
            // html2canvas ignores CSS filters, so black and white is baked into
            // the pixels here (ctx.filter isn't in every Safari).
            if (state.bw) {
              const px = cx.getImageData(0, 0, c.width, c.height), d = px.data;
              for (let k = 0; k < d.length; k += 4) {
                const y = 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2];
                d[k] = d[k + 1] = d[k + 2] = y;
              }
              cx.putImageData(px, 0, 0);
            }
            c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            im.replaceWith(c);
          }
          const foil = [...face.querySelectorAll('.cf-text.foil')];
          foil.forEach((el) => { el.style.visibility = 'hidden'; });
          const canvas = await window.html2canvas(face, {
            scale, backgroundColor: null, useCORS: true, logging: false,
            width: face.offsetWidth, height: face.offsetHeight,
          });
          foil.forEach((el) => { el.style.visibility = ''; });
          const origin = face.getBoundingClientRect();
          const ctx = canvas.getContext('2d');
          // html2canvas leaves its own scale on the context; foil is placed in canvas pixels.
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          foil.forEach((el) => paintFoil(ctx, el, origin, scale, face.offsetHeight));
          if (canvas.width !== trim.w || canvas.height !== trim.h) {
            const out = document.createElement('canvas');
            out.width = trim.w; out.height = trim.h;
            out.getContext('2d').drawImage(canvas, 0, 0, trim.w, trim.h);
            return out;
          }
          return canvas;
        } finally {
          holder.remove();
        }
      }

      // Trim → bleed. Template geometry is fractions of TRIM (cards.mjs), so the
      // bleed is made by mirroring the outermost strip of the finished card
      // outward. Whatever touches an edge (photo, ground, scrim) carries on past
      // the cut, and nothing inside the card moves. Mirrored rather than
      // stretched: a stretched edge shows as streaks in the print preview.
      function toBleed(trimCanvas) {
        const tpl = state.template;
        const b = C.cardBleedSize(tpl.formatId, tpl.orientation);
        const out = document.createElement('canvas');
        out.width = b.w; out.height = b.h;
        const ctx = out.getContext('2d');
        const W = trimCanvas.width, H = trimCanvas.height, ox = b.offsetX, oy = b.offsetY;
        // html2canvas leaves the outermost pixel row a shade dark (the face's own
        // ground antialiasing in under the photo), and mirroring would double it
        // into a line along the cut. Repaint the outer 2px from just inside.
        const tctx = trimCanvas.getContext('2d');
        const E = 2;
        for (let i = 0; i < E; i++) {
          tctx.drawImage(trimCanvas, 0, E, W, 1, 0, i, W, 1);
          tctx.drawImage(trimCanvas, 0, H - 1 - E, W, 1, 0, H - 1 - i, W, 1);
          tctx.drawImage(trimCanvas, E, 0, 1, H, i, 0, 1, H);
          tctx.drawImage(trimCanvas, W - 1 - E, 0, 1, H, W - 1 - i, 0, 1, H);
        }
        const mirror = (src, sx, sy, sw, sh, dx, dy, flipX, flipY) => {
          ctx.save();
          ctx.translate(dx + (flipX ? sw : 0), dy + (flipY ? sh : 0));
          ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
          ctx.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
          ctx.restore();
        };
        ctx.drawImage(trimCanvas, ox, oy);
        mirror(trimCanvas, 0, 0, W, oy, ox, 0, false, true);                    // top
        mirror(trimCanvas, 0, H - (b.h - oy - H), W, b.h - oy - H, ox, oy + H, false, true);   // bottom
        const snap = document.createElement('canvas');
        snap.width = b.w; snap.height = b.h;
        snap.getContext('2d').drawImage(out, 0, 0);
        mirror(snap, ox, 0, ox, b.h, 0, 0, true, false);                        // left, corners included
        mirror(snap, ox + W - (b.w - ox - W), 0, b.w - ox - W, b.h, ox + W, 0, true, false);   // right
        // The lab's print area can be smaller than a full 1/8in bleed (District
        // Photo's is ~1/16in at the sides). Crop to it, centred, so Printify
        // gets exactly its size and nothing inside the trim moves.
        const pp = printArea(tpl);
        if (pp && (pp.w !== b.w || pp.h !== b.h)) {
          const crop = document.createElement('canvas');
          crop.width = pp.w; crop.height = pp.h;
          crop.getContext('2d').drawImage(out, Math.round((b.w - pp.w) / 2), Math.round((b.h - pp.h) / 2), pp.w, pp.h, 0, 0, pp.w, pp.h);
          return crop;
        }
        return out;
      }

      // The lab's print area turned to the card's orientation. Printify's is
      // portrait; a landscape card is laid out landscape and turned a quarter
      // turn only at upload (toPrintify), so the customer never sees it sideways.
      function printArea(tpl) {
        const pp = C.CARD_FORMATS[tpl.formatId].printPx;
        if (!pp) return null;
        return tpl.orientation === 'landscape' ? { w: pp.h, h: pp.w } : pp;
      }
      function toPrintify(canvas) {
        if (state.template.orientation !== 'landscape') return canvas;
        const r = document.createElement('canvas');
        r.width = canvas.height; r.height = canvas.width;
        const ctx = r.getContext('2d');
        // Clockwise: the card's top edge runs down the print file's right side.
        // Check it against the first landscape sample.
        ctx.translate(r.width, 0);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(canvas, 0, 0);
        return r;
      }

      // The back: how to play the card. Same colourway as the front.
      // The back, laid out like the books' back cover so every Popcode product
      // reads the same: the wordmark, two lines, the symbol, anchored near the
      // bottom of a white back, with an optional square photo above. Line two
      // differs from the books ("Scan photos with the Popcode symbol"): a card's
      // front carries no symbol, the whole front is what scans.
      const BACK = {
        logoW: 1.1, gapLogo: 0.19, textPt: 9, leadPt: 14, gapSym: 0.16, symW: 0.36, bottom: 0.40,
        logo: '/assets/Popcode_logo.png', logoAspect: 591 / 2232,
      };
      // Back photo shapes, as width / height.
      const BACK_SHAPES = { landscape: 3 / 2, portrait: 4 / 5, square: 1 };
      // Back photo size, as a share of the biggest that fits.
      const BACK_SIZES = { small: 0.55, medium: 0.78, large: 1 };
      function backShape(img) {
        const set = state.back && state.back.shape;
        if (BACK_SHAPES[set]) return set;
        if (!img || !img.naturalWidth) return 'square';
        const r = img.naturalWidth / img.naturalHeight;
        return r > 1.15 ? 'landscape' : r < 0.87 ? 'portrait' : 'square';
      }
      async function renderBack(slug, opts) {
        opts = opts || {};
        const tpl = state.template;
        const b = { ...C.cardBleedSize(tpl.formatId, tpl.orientation) };
        const pp = printArea(tpl);
        if (pp) { b.offsetX -= (b.w - pp.w) / 2; b.offsetY -= (b.h - pp.h) / 2; b.w = pp.w; b.h = pp.h; }
        const c = document.createElement('canvas');
        c.width = b.w; c.height = b.h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, b.w, b.h);
        await Promise.all(['600', '700'].map((w) => document.fonts.load(`${w} 40px Inter`))).catch(() => {});
        const inch = b.dpi, cx = b.w / 2, k = BACK;
        const trimBottom = b.h - b.offsetY;
        const blockH = (k.logoW * k.logoAspect + k.gapLogo + (k.leadPt * 2) / 72 + k.gapSym + k.symW) * inch;
        let y = trimBottom - k.bottom * inch - blockH;

        // The photo, square, centred in the space above the block. Printed flat,
        // no shadow. In the editor (opts.placeholder) an empty spot is a light
        // grey square with a picture icon, so it's clear it can be tapped; the
        // print file never has it.
        // The photo is as big as the space above the block allows, in the
        // shape the buyer picks (landscape / portrait / square; by default the
        // photo's own shape). An empty spot is drawn square.
        let img = null;
        if (state.back && state.back.url) { try { img = await loadImg(state.back.url); } catch (_) {} }
        const shape = backShape(img);
        const ratio = BACK_SHAPES[shape];
        const trimW = b.w - 2 * b.offsetX;
        const top = b.offsetY + 0.42 * inch;
        const boxW = trimW - 0.84 * inch, boxH = Math.max(0.5 * inch, y - 0.34 * inch - top);
        const scaleBy = BACK_SIZES[(state.back && state.back.size) || 'large'] || 1;
        const pw = Math.min(boxW, boxH * ratio) * scaleBy, ph = pw / ratio;
        const px = cx - pw / 2, py = top + (boxH - ph) / 2;
        const side = Math.min(pw, ph);
        if (!img && opts.placeholder) {
          ctx.fillStyle = '#efefef';
          ctx.fillRect(px, py, pw, ph);
          // A 24-unit picture icon, 28% of the square, a little above centre.
          const isz = side * 0.28, ix = cx - isz / 2, iy = py + side / 2 - isz * 0.7;
          ctx.save();
          ctx.translate(ix, iy); ctx.scale(isz / 24, isz / 24);
          ctx.strokeStyle = '#a3a3a3'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.roundRect(1.5, 2.5, 21, 19, 2.5); ctx.stroke();
          ctx.beginPath(); ctx.arc(8.5, 9, 2, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(22, 16); ctx.lineTo(16, 10); ctx.lineTo(5, 21); ctx.stroke();
          ctx.restore();
          ctx.fillStyle = '#8a8a8a';
          ctx.font = `600 ${0.13 * inch}px 'Inter', sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText('Add a photo', cx, iy + isz + side * 0.06);
          ctx.textAlign = 'left';
        }
        if (img) {
          ctx.save();
          ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
          ctx.translate(px, py);
          drawCover(ctx, img, pw, ph);
          ctx.restore();
        }

        try {
          const logo = await loadImg(k.logo);
          const lw = k.logoW * inch;
          ctx.drawImage(logo, cx - lw / 2, y, lw, lw * k.logoAspect);
        } catch (_) {}
        y += (k.logoW * k.logoAspect + k.gapLogo) * inch;
        const fs = k.textPt / 72 * inch, lead = k.leadPt / 72 * inch;
        const font = (wt) => `${wt} ${fs}px 'Inter', sans-serif`;
        ctx.fillStyle = '#1a1a1a';
        ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
        const line = (runs, baseY) => {
          let total = 0;
          for (const r of runs) { ctx.font = font(r[1]); total += ctx.measureText(r[0]).width; }
          let lx = cx - total / 2;
          for (const r of runs) { ctx.font = font(r[1]); ctx.fillText(r[0], lx, baseY); lx += ctx.measureText(r[0]).width; }
        };
        const base = (n) => y + lead * n + lead * 0.5 + fs * 0.35;
        line([['Go to ', 600], ['popcode.app/' + slug, 700], [' on your phone.', 600]], base(0));
        line([['Scan the front of this card.', 600]], base(1));
        y += lead * 2 + k.gapSym * inch;
        try {
          const sym = await loadImg('/assets/popcode_symbol_color.svg');
          const sw = k.symW * inch;
          ctx.drawImage(sym, cx - sw / 2, y, sw, sw);
        } catch (_) {}
        return c;
      }

      const toJpeg = (canvas, q) => new Promise((res, rej) =>
        canvas.toBlob((bl) => (bl ? res(bl) : rej(new Error('Could not encode the card image.'))), 'image/jpeg', q || 0.92));

      async function uploadWithRetry(path, blob, contentType, tries = 3) {
        let last = null;
        for (let i = 0; i < tries; i++) {
          const { error } = await db.storage.from('experiences').upload(path, blob, { contentType, upsert: true });
          if (!error) return db.storage.from('experiences').getPublicUrl(path).data.publicUrl;
          last = error;
          await new Promise((r) => setTimeout(r, 800 * (i + 1)));
        }
        throw new Error('Upload failed: ' + (last && last.message));
      }

      // ── Save ────────────────────────────────────────────────────────────
      // A card is a Popcode: its printed front is the AR target and plays the
      // attached video. It saves as kind:'card' (no migration beyond counting it
      // free, 2026-10-20-cards-free.sql) with the design in book_layout.card, so
      // My Designs can reopen it here.
      let editing = null;   // { id, slug } once saved or when opened from My Designs

      function setBusy(text) {
        const btn = $('cart-btn');
        if (btn) { btn.disabled = !!text; btn.textContent = text || 'Add to cart'; }
        const sb = $('save-btn');
        if (sb) sb.disabled = !!text;
      }

      // The template's sample names are only an example. Printing "The Middleton
      // Family" on someone's cards is the mistake this stops. Zones carry
      // `sample` in cards.mjs; the role alone can't say (Modern Signature's
      // "signature" zone is the word HOLIDAYS).
      function unchangedSample() {
        if (state.custom) {
          const b = state.custom.boxes.find((x) => x.sample && x.text.trim() === (x.sampleText || '').trim());
          return b ? { value: b.text } : null;
        }
        return C.resolveText(state.template, state.text, state.greeting)
          .filter((z) => z.sample && z.value && z.value === z.default)[0] || null;
      }

      // `draft` (Save for later): keep a card in progress -- no Popcode, a photo
      // still to add, the example words still in. It is made scannable only
      // once it has its Popcode and every photo; Add to cart checks it all.
      async function saveCard(opts) {
        const draft = !!(opts && opts.draft);
        const tpl = state.template;
        const need = tpl.photos.filter((s) => !state.photos[s.id]);
        if (need.length && !draft) throw new Error('Add ' + (need.length === 1 ? 'a photo' : need.length + ' photos') + ' first.');
        if (!state.popcode && !draft) throw new Error('Add a Popcode. It’s what plays when someone scans the card.');
        const sample = unchangedSample();
        if (sample && !draft) throw new Error('Change “' + sample.value + '” to your own words. It’s the example text.');
        const scannable = !!state.popcode && !need.length;
        if (scannable && (typeof MINDAR === 'undefined' || !MINDAR.IMAGE || !MINDAR.IMAGE.Compiler)) {
          throw new Error('Still loading. Wait a moment and try again.');
        }

        let slug = editing && editing.slug;
        // The link the buyer chose (or that the name filled in). Left empty, a
        // random one is made, as before.
        if (!slug && slugField && slugField.get()) {
          if (!(await slugField.ensureFree())) {
            $('slug-input').scrollIntoView({ block: 'center', behavior: 'smooth' });
            throw new Error('popcode.app/' + slugField.get() + ' can’t be used. Pick a different link (suggestions are under it).');
          }
          slug = slugField.get();
        }
        if (!slug) {
          for (let i = 0; i < 6 && !slug; i++) {
            const cand = PopcodeSlug.randomSlug();
            if (await PopcodeSlug.isAvailable(db, cand)) slug = cand;
          }
          if (!slug) throw new Error('Could not reserve a link. Please try again.');
        }
        const stamp = Date.now().toString(36);
        // A duplicate (or a design reopened under a new slug) still points at the
        // original's files. Copy them under this slug so deleting one can't gut the other.
        const remap = PopcodeStorageCopy.makeRemapper(db, 'experiences', slug, {
          onError: (err) => { if (window.Sentry) try { Sentry.captureException(err); } catch (e) {} },
        });

        // 1. The photos as chosen, so the design can be reopened and re-cropped.
        setBusy('Saving your photos…');
        const photoUrls = {};
        for (const s of tpl.photos) {
          const p = state.photos[s.id];
          if (!p) continue;
          if (p.file) {
            const ext = ((p.file.name || '').split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
            photoUrls[s.id] = await uploadWithRetry(`${slug}/card/${s.id}-${stamp}.${ext}`, p.file, p.file.type || 'image/jpeg');
            state.photos[s.id] = { url: photoUrls[s.id], adjust: p.adjust };   // keep the crop
          } else {
            photoUrls[s.id] = (await remap(p.url)) || p.url;
          }
        }

        // 1b. The back photo, if any.
        let backUrl = null;
        if (state.back) {
          if (state.back.file) {
            backUrl = await uploadWithRetry(`${slug}/card/back-photo-${stamp}.jpg`, state.back.file, state.back.file.type || 'image/jpeg');
            state.back = { url: backUrl, shape: state.back.shape, size: state.back.size };
          } else {
            backUrl = (await remap(state.back.url)) || state.back.url;
          }
        }

        // 2. The front as it will print. It is the scan target and the thumbnail.
        setBusy('Laying out your card…');
        const front = await renderFrontTrim();
        const frontUrl = await uploadWithRetry(`${slug}/card/front-${stamp}.jpg`, await toJpeg(front, 0.9), 'image/jpeg');

        // 3. Make the front scannable. Compiled from the whole printed face, type
        //    and all, because that is what the phone will see.
        let mindUrl = '';
        if (scannable) {
        setBusy('Making it scannable…');
        const small = document.createElement('canvas');
        small.width = 1000; small.height = Math.round(1000 * front.height / front.width);
        small.getContext('2d').drawImage(front, 0, 0, small.width, small.height);
        const targetImg = await loadImg(small.toDataURL('image/jpeg', 0.92));
        const compiler = new MINDAR.IMAGE.Compiler();
        await compiler.compileImageTargets([targetImg], () => {});
        mindUrl = await uploadWithRetry(`${slug}/target.mind`, new Blob([await compiler.exportData()]), 'application/octet-stream')
          + '?v=' + stamp;
        }

        // 4. What it plays: a video (or montage) or an audio clip.
        const pc = state.popcode;
        let videoUrl = null, audioUrl = null;
        if (!pc) {
          // A draft with nothing to play yet.
        } else if (pc.mediaType === 'audio') {
          setBusy('Uploading your audio…');
          if (pc.audio) {
            const ext = ((pc.audio.name || '').split('.').pop() || 'webm').toLowerCase();
            audioUrl = await uploadWithRetry(`${slug}/audio_0_${stamp}.${ext}`, pc.audio, pc.audio.type || 'audio/webm');
          } else {
            audioUrl = (await remap(pc.existingAudioUrl)) || pc.existingAudioUrl;
          }
          state.popcode = { mediaType: 'audio', existingAudioUrl: audioUrl };
        } else {
          setBusy('Uploading your video…');
          if (pc.video) {
            videoUrl = await uploadWithRetry(`${slug}/video_0_${stamp}.mp4`, pc.video, pc.video.type || 'video/mp4');
          } else {
            videoUrl = (await remap(pc.existingVideoUrl)) || pc.existingVideoUrl;
          }
          state.popcode = { mediaType: 'video', existingVideoUrl: videoUrl };
        }

        // 5. The row and its one Popcode.
        setBusy('Saving…');
        // The greeting, whole: a split one (Brighton's MERRY / CHRISTMAS) joined.
        const zones = C.resolveText(tpl, state.text, state.greeting);
        const greetLines = zones.filter((z) => z.greet).map((z) => z.value.trim()).filter(Boolean);
        const headline = (state.custom ? (state.custom.boxes.find((b) => b.text.trim()) || {}).text
          : greetLines.length ? greetLines.join(' ').replace(/\s+&$/, ' & …') : (zones.find((z) => z.role === 'headline') || {}).value) || tpl.name;
        const row = {
          name: (state.name || '').trim() || ('Cards · 5×7 — ' + headline),
          kind: 'card',
          mind_file_url: mindUrl,
          book_layout: {
            card: {
              templateId: tpl.id, formatId: tpl.formatId, orientation: tpl.orientation,
              title: (state.name || '').trim() || null,
              occasionId: state.occasionId, text: state.text, photos: photoUrls,
              colorway: state.colorway, pack: state.pack, bw: state.bw, frontUrl,
              greeting: state.greeting, corners: state.corners, script: state.script, moves: state.custom ? null : state.moves, backPhoto: backUrl, backShape: state.back ? backShape(await loadImg(backUrl).catch(() => null)) : null, backSize: state.back ? (state.back.size || 'large') : null,
              custom: state.custom ? JSON.parse(JSON.stringify(state.custom)) : null,
              // Edit Photo crops, per slot.
              adjust: Object.fromEntries(Object.entries(state.photos).filter(([, p]) => p.adjust).map(([k, p]) => [k, p.adjust])),
            },
          },
        };
        let collectionId;
        if (editing && editing.id) {
          const { error } = await db.from('collections').update(row).eq('id', editing.id);
          if (error) throw new Error('Could not save: ' + error.message);
          collectionId = editing.id;
          await db.from('collection_items').delete().eq('collection_id', collectionId);
        } else {
          if (!currentUser) throw new Error('Sign in to save your card.');
          const { data, error } = await db.from('collections')
            .insert({ ...row, slug, user_id: currentUser.id }).select().single();
          if (error) throw new Error('Could not save: ' + error.message);
          collectionId = data.id;
        }
        if (pc) {
          const { error: iErr } = await db.from('collection_items').insert({
            collection_id: collectionId, target_index: 0, media_type: pc.mediaType === 'audio' ? 'audio' : 'video',
            video_url: videoUrl, audio_url: audioUrl, photo_url: frontUrl,
          });
          if (iErr) throw new Error('Saved, but linking the video failed: ' + iErr.message);
        }
        editing = { id: collectionId, slug };
        if (slugField) slugField.lock(slug, 'This card’s link. It’s locked so printed cards keep working.');
        const u = new URL(location.href);
        u.searchParams.set('id', slug); u.searchParams.delete('duplicate');
        history.replaceState(null, '', u);
        return { slug, collectionId, front, frontUrl, headline, scannable };
      }

      async function onSave() {
        try {
          const saved = await saveCard({ draft: true });
          setBusy(null);
          const where = '<b>' + esc((state.name || '').trim() || 'Your card') + '</b> is in My Designs';
          openSheet('<h2>Card saved</h2><p class="sheet-sub">' + where + (saved.scannable
            ? ', and it plays at <b>popcode.app/' + esc(saved.slug) + '</b>.'
            : '. Open it from there any time to finish it' + (state.popcode ? '.' : ' and add its Popcode.')) + '</p>' +
            '<div class="sheet-actions"><button style="background:#f0efec" onclick="location.href=\'/manage.html?tab=designs\'">My Designs</button>' +
            '<button style="background:#1a1a1a;color:#fff" onclick="closeSheet()">Keep editing</button></div>');
        } catch (err) {
          setBusy(null);
          console.error(err);
          if (window.Sentry && !/first|Attach|Change|Still loading/.test(err.message)) try { Sentry.captureException(err); } catch (e) {}
          alert(err.message || String(err));
        }
      }

      async function addToCart() {
        try {
          const saved = await saveCard();
          setBusy('Preparing the print files…');
          const frontCanvas = toBleed(saved.front);
          const backCanvas = await renderBack(saved.slug);
          // The preview shows the card the right way up; Printify gets it turned.
          const frontBlob = await toJpeg(toPrintify(frontCanvas), 0.95);
          const backBlob = await toJpeg(toPrintify(backCanvas), 0.95);
          const urls = [URL.createObjectURL(await toJpeg(frontCanvas, 0.9)), URL.createObjectURL(await toJpeg(backCanvas, 0.9))];
          // The print file in mm (it is 300 DPI). The preview draws one inset on
          // all four sides, so it uses the deeper top/bottom bleed: the safe line
          // sits at least 1/4in inside the trim everywhere.
          const pp = printArea(state.template);
          const mm = (px) => px / 300 * 25.4;
          const face = { wMm: mm(pp.w), hMm: mm(pp.h), safeMm: 6.35 + mm((Math.max(pp.w, pp.h) - 2100) / 2) };
          let go;
          try {
            go = await PopcodePrintPreview.open({
              mode: 'cart',
              intro: 'This is exactly what we’ll print, front and back. The outer edge is trimmed off, so keep faces and words inside the dashed line.',
              sections: [{ heading: state.pack + ' cards, 5×7″, with envelopes', html: PopcodePrintPreview.list({ cols: 2, items: [
                { src: urls[0], label: 'Front', ...face },
                { src: urls[1], label: 'Back', ...face },
              ] }) }],
            });
          } finally {
            urls.forEach((x) => URL.revokeObjectURL(x));
          }
          if (go !== true) { setBusy(null); return; }
          setBusy('Adding to your cart…');
          const stamp = Date.now().toString(36);
          const frontUrl = await uploadWithRetry(`${saved.slug}/card/print-front-${stamp}.jpg`, frontBlob, 'image/jpeg');
          const backUrl = await uploadWithRetry(`${saved.slug}/card/print-back-${stamp}.jpg`, backBlob, 'image/jpeg');
          await PopcodeCart.add({
            collectionId: saved.collectionId,
            productType: 'card',
            // Printify sells each pack as its own variant, so a pack is one copy.
            variantId: 'card-5x7-' + C.packFor(state.pack).pack + (state.corners === 'rounded' ? '-round' : ''),
            copies: C.packFor(state.pack).copies,
            assetUrls: [{ url: frontUrl, print_area: 'front' }, { url: backUrl, print_area: 'back' }],
            title: saved.headline + ' — ' + state.pack + ' cards, 5×7″',
            thumbUrl: saved.frontUrl,
            options: { sizeLabel: '5×7″ flat cards', orientationLabel: (state.template.orientation === 'landscape' ? 'landscape, ' : '') +
              (state.corners === 'rounded' ? 'rounded corners, ' : '') + 'with envelopes' },
          });
          location.href = '/cart.html';
        } catch (err) {
          setBusy(null);
          console.error(err);
          if (window.Sentry && !/first|Attach|Change|Still loading/.test(err.message)) try { Sentry.captureException(err); } catch (e) {}
          alert(err.message || String(err));
        }
      }

      // Reopen a saved card (?id=slug from My Designs or the cart). With
      // &duplicate=1 it opens unattached, so saving makes a new card.
      async function loadCard(slug, duplicate) {
        const { data: col, error } = await db.from('collections')
          .select('id, slug, kind, book_layout, user_id').eq('slug', slug).maybeSingle();
        const cfg = col && col.book_layout && col.book_layout.card;
        if (cfg && cfg.custom) {
          state.custom = cfg.custom;
          boxSeq = Math.max(0, ...cfg.custom.boxes.map((b) => parseInt(String(b.id).slice(1), 10) || 0));
        } else {
          state.custom = null;
        }
        const tpl = cfg && (cfg.custom ? customTemplate() : C.templateById(cfg.templateId));
        if (error || !col || col.kind !== 'card' || !tpl || col.user_id !== currentUser.id) {
          renderBrowse();
          alert('That card couldn’t be opened.');
          return;
        }
        const { data: items } = await db.from('collection_items')
          .select('media_type, video_url, audio_url').eq('collection_id', col.id).order('target_index').limit(1);
        state.occasionId = cfg.occasionId || state.occasionId;
        state.template = tpl;
        state.text = cfg.text || {};
        state.colorway = cfg.colorway || (tpl.colorways && tpl.colorways[0]) || C.DEFAULT_COLORWAY;
        state.pack = C.CARD_QUANTITIES.includes(cfg.pack) ? cfg.pack : C.DEFAULT_PACK;
        state.photos = {};
        Object.entries(cfg.photos || {}).forEach(([k, url]) => { if (url) state.photos[k] = { url, adjust: (cfg.adjust || {})[k] }; });
        const it = items && items[0];
        state.popcode = it && it.media_type === 'audio' && it.audio_url ? { mediaType: 'audio', existingAudioUrl: it.audio_url }
          : it && it.video_url ? { mediaType: 'video', existingVideoUrl: it.video_url } : null;
        state.bw = !!cfg.bw;
        state.greeting = cfg.greeting || 'holiday';
        state.corners = cfg.corners === 'rounded' ? 'rounded' : 'square';
        state.script = C.SCRIPTS.some((x) => x.id === cfg.script) ? cfg.script : null;
        state.moves = (cfg.moves && typeof cfg.moves === 'object') ? cfg.moves : {};
        state.name = cfg.title || '';
        state.slug = null; state.slugTouched = false;   // a duplicate gets its own link
        state.back = cfg.backPhoto ? { url: cfg.backPhoto, shape: cfg.backShape || null, size: cfg.backSize || 'large' } : null;
        editing = duplicate ? null : { id: col.id, slug: col.slug };
        $('step-browse').classList.add('hidden');
        $('step-edit').classList.remove('hidden');
        renderEditor();
      }

      // ── Boot ────────────────────────────────────────────────────────────
      // Deferred to DOMContentLoaded: running at parse time would hit the TDZ on
      // the `let`s above (the scan.html lesson).
      document.addEventListener('DOMContentLoaded', () => {
        if (!C || !C.CARD_TEMPLATES) {
          document.querySelector('.wrap').innerHTML =
            '<p style="color:#b00">Card templates failed to load. Run <code>node scripts/build-card-templates.mjs</code>.</p>';
          return;
        }
        const q = new URLSearchParams(location.search);
        if (q.get('occasion')) state.occasionId = q.get('occasion');
        // ?section=wedding opens that tab on its first occasion with designs.
        if (q.get('section')) {
          const first = C.occasionsWithCounts().find((o) => o.section.toLowerCase() === q.get('section').toLowerCase());
          if (first) state.occasionId = first.id;
        }
        db.auth.getSession().then(({ data }) => {
          if (!data.session) { location.href = '/auth.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
          currentUser = data.session.user;
          if (q.get('id')) loadCard(q.get('id'), q.get('duplicate') === '1');
          else renderBrowse();
        });
      });
    </script>
    <script src="/nav.js"></script>
  </body>
</html>
