<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Sentry error monitoring (errors-only; init in /sentry-init.js) -->
    <script
      src="https://browser.sentry-cdn.com/10.59.0/bundle.min.js"
      integrity="sha384-V80tE+22zYqM17YuWTi3GmAl/uJSKuAi5ov4G1Y6Zyw9wvVwwv9zree5oYNbB5Rn"
      crossorigin="anonymous"></script>
    <script src="/sentry-init.js"></script>
    <link rel="icon" href="/assets/popcode_symbol_color.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/Popcode_logo.png">
    <meta property="og:title" content="Popcode">
    <meta property="og:description" content="Bring your photos to life with AR video">
    <meta property="og:image" content="https://popcode.app/assets/og_image.png?v=2">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>Popcode — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/dialog.js"></script>
    <script src="/activity.js"></script>
    <link rel="stylesheet" href="/assets/fonts.css">
    <script src="/nav.js" defer></script>
    <style>
      @font-face {
        font-family: 'FilsonPro';
        src: url('/assets/fonts/FilsonProMedium/font.woff2') format('woff2'),
             url('/assets/fonts/FilsonProMedium/font.woff') format('woff');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'FilsonPro';
        src: url('/assets/fonts/FilsonProBold/font.woff2') format('woff2'),
             url('/assets/fonts/FilsonProBold/font.woff') format('woff');
        font-weight: 700;
        font-style: normal;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: #f9f9f9;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        color: #1a1a1a;
        overflow-x: hidden;
      }
      h1, h2, h3 { font-family: 'CooperBT', serif; font-weight: 400; }

      /* Same nav as every other page (nav.js), then the Shop page's hero:
         same gradient, same arch, text flush left on the nav's first link. */
      body .site-header::after { display: none; }  /* nav.js's shelf smears on the gradient */
      .hero {
        position: relative; width: 100vw; overflow-x: clip; color: #fff;
        background: linear-gradient(135deg, #5bc8f5 0%, #7c3aed 100%);
        padding: 36px 0 230px;
      }
      /* nav.js pins the inline nav's first link at 382px wherever the nav isn't
         compressing (>=1280) — same rule as shop.html. Narrower, a centred column. */
      .hero-inner { padding: 0 28px 0 382px; position: relative; z-index: 1; }
      @media (max-width: 1279px) { .hero-inner { max-width: 1040px; margin: 0 auto; padding: 0 28px; } }
      .hero-title { font-size: 46px; line-height: 1.0; letter-spacing: -0.02em; margin: 0 0 18px; }
      .hero-sub { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.93); margin: 0; white-space: nowrap; }
      .hero-sub a { color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
      .hero-curve {
        position: absolute; left: -2%; bottom: -1px; width: 104%; height: 190px;
        display: block; pointer-events: none;
      }

      .form-side { display: flex; flex-direction: column; align-items: center; padding: 0 20px 24px; margin-top: -60px; position: relative; z-index: 2; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .hero-inner { animation: rise .6s ease both; }
      .card { animation: rise .6s .12s ease both; }
      @media (prefers-reduced-motion: reduce) { .hero-inner, .card { animation: none; } }

      /* New or returning, picked up front instead of hunted for at the bottom. */
      .mode-tabs { display: flex; background: #ececec; border-radius: 999px; padding: 4px; margin-bottom: 24px; }
      .mode-tabs button {
        flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 10px 12px;
        font: 600 14px 'Inter', sans-serif; color: #777; cursor: pointer; transition: background .15s, color .15s;
      }
      .mode-tabs button.active { background: #fff; color: #1a1a1a; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

      @media (max-width: 680px) {
        .hero { padding: 40px 0 96px; }
        .hero-title { font-size: 38px; }
        .hero-sub { font-size: 16px; white-space: normal; }
        /* On a phone the same curve at 120px read as a steep hill; 60px keeps it a gentle arch. */
        .hero-curve { height: 60px; }
        .form-side { margin-top: -16px; }
        /* Fields and button don't need the full phone width. */
        .form-side .card { max-width: 300px; }
      }
      label { font-family: 'Inter', sans-serif; }
      /* No card any more — the form sits on the page. The class stays because
         the scripts and animation hang off it. */
      .card { width: 100%; max-width: 400px; }
      h1 { font-size: 30px; margin-bottom: 24px; text-align: center; color: #1a1a1a; letter-spacing: -0.01em; }
      .field { margin-bottom: 16px; }
      label { font-size: 13px; font-weight: 700; color: #555; display: block; margin-bottom: 6px; }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; padding: 13px 16px; border-radius: 12px;
        border: 1px solid #e3e3e3;
        font-size: 15px; color: #1a1a1a; outline: none;
        font-family: 'Inter', sans-serif;
        background: #fff;
      }
      .submit-btn {
        width: 100%; padding: 15px; border-radius: 30px; border: none;
        background: #1a1a1a;
        color: white; font-size: 16px; font-weight: 700;
        font-family: 'Inter', sans-serif;
        cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
      }
      .terms-field {
        display: flex; align-items: flex-start; gap: 10px;
        margin-bottom: 16px; font-size: 13px; color: #555; line-height: 1.5;
      }
      .terms-field input[type="checkbox"] {
        margin-top: 2px; flex-shrink: 0; width: 16px; height: 16px;
        accent-color: #7657FC; cursor: pointer;
      }
      .terms-field label { font-size: 13px; font-weight: 400; color: #555; margin: 0; cursor: pointer; }
      .terms-field a { color: #1a1a1a; text-decoration: underline; }
      footer {
        margin: 32px auto 0; padding: 16px; text-align: center;
        font-size: 12px; color: #888;
      }
      footer a { color: #888; text-decoration: underline; margin: 0 8px; }
      .submit-btn:hover { opacity: 0.9; }
      .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .toggle {
        margin-top: 20px; text-align: center; font-size: 13px; color: #888;
      }
      .toggle a { color: #1a1a1a; font-weight: 700; cursor: pointer; text-decoration: underline; }
      .forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
      .forgot a { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; }
      .forgot a:hover { color: #1a1a1a; }
      .error-msg {
        display: none; background: #fff0f0; border: 1px solid #ffcccc;
        border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
        line-height: 1.5; color: #cc3333;
      }
      /* A notice can carry a hint line and a resend button (lost-email help). */
      .notice-hint { display: block; margin-top: 6px; font-size: 12px; opacity: .85; }
      .notice-btn {
        display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 999px;
        border: 1px solid currentColor; background: #fff; color: inherit; cursor: pointer;
        font: 600 13px 'Inter', sans-serif;
      }
      .notice-btn:disabled { opacity: .55; cursor: default; }
      .success-msg {
        display: none; background: #f0fff4; border: 1px solid #bbf7d0;
        border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
        line-height: 1.5; color: #16a34a;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-inner">
        <h2 class="hero-title">Welcome.<br>Or welcome back.</h2>
        <p class="hero-sub">Sign in to make, share and order all things Popcode. Or <a id="hero-create">create a new account</a>.</p>
      </div>
      <svg class="hero-curve" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 96 C 320 -16, 880 -16, 1200 96 L1200 200 L0 200 Z" fill="#f9f9f9"/>
      </svg>
    </section>
    <main class="form-side">
    <div class="card">
      <div class="mode-tabs" id="mode-tabs" role="tablist">
        <button type="button" data-mode="signin" role="tab">Sign in</button>
        <button type="button" data-mode="signup" role="tab">Create account</button>
      </div>
      <h1 id="form-title">Sign In</h1>
      <div class="error-msg" id="error-msg"></div>
      <div class="field" id="name-field" style="display:none;">
        <label for="name">Your Name</label>
        <input type="text" id="name" autocomplete="name" placeholder="First and last name"/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Password"/>
      </div>
      <div class="forgot" id="forgot-wrap">
        <a id="forgot-link">Forgot password?</a>
      </div>
      <div class="terms-field" id="terms-field" style="display:none;">
        <input type="checkbox" id="terms-checkbox"/>
        <label for="terms-checkbox">I agree to the <a href="/terms.html" target="_blank">Terms &amp; Conditions</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</label>
      </div>
      <!-- Marketing consent: optional, separate from the terms, and never
           pre-ticked — all three are what make it valid consent in the EU/UK. -->
      <div class="terms-field" id="marketing-field" style="display:none;">
        <input type="checkbox" id="marketing-checkbox"/>
        <label for="marketing-checkbox">Send me tips, ideas and news from Popcode. Unsubscribe anytime.</label>
      </div>
      <button class="submit-btn" id="submit-btn">Sign In</button>
      <div class="toggle">
        <span id="toggle-text">Don't have an account?</span>
        <a id="toggle-link">Create one</a>
      </div>
      <div class="success-msg" id="success-msg"></div>
    </div>

    <footer>
      <a href="/terms.html">Terms</a> <span style="color:#ccc">·</span> <a href="/privacy.html">Privacy</a>
    </footer>
    </main>

    <script>
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Where to land after signing in. A page that bounced you here (e.g. the
      // cart) passes ?next=/cart.html so you continue where you left off rather
      // than being dumped on My Popcodes. Only a same-origin ABSOLUTE PATH is
      // accepted — "//evil.com" and "https://evil.com" are rejected, so this
      // can't be turned into an open redirect.
      function landingPage() {
        const next = new URLSearchParams(location.search).get('next');
        if (next && /^\/[^/\\]/.test(next)) return next;
        return '/manage.html';
      }

      // Redirect if already signed in
      db.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = landingPage();
      });

      // 'signin' | 'signup' | 'forgot'. ?mode=signup lets the places that
      // assume you do not have an account yet — Create a Popcode, buying a pack
      // — land on the sign-up form rather than making you find the toggle.
      let mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'signin';

      function setMode(newMode) {
        mode = newMode;
        const isSignUp = mode === 'signup';
        const isForgot = mode === 'forgot';
        const titles = { signin: 'Sign In', signup: 'Create Account', forgot: 'Reset Password' };
        const submitText = { signin: 'Sign In', signup: 'Create Account', forgot: 'Send Reset Link' };
        document.getElementById('form-title').textContent = titles[mode];
        // The tabs name the form, so the card title only shows for reset.
        document.getElementById('form-title').style.display = isForgot ? 'block' : 'none';
        document.getElementById('mode-tabs').style.display = isForgot ? 'none' : 'flex';
        document.querySelectorAll('#mode-tabs button').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === mode);
          b.setAttribute('aria-selected', b.dataset.mode === mode ? 'true' : 'false');
        });
        document.querySelector('.toggle').style.display = isForgot ? 'block' : 'none';
        document.getElementById('submit-btn').textContent = submitText[mode];
        document.getElementById('name-field').style.display = isSignUp ? 'block' : 'none';
        document.getElementById('password').closest('.field').style.display = isForgot ? 'none' : 'block';
        document.getElementById('forgot-wrap').style.display = mode === 'signin' ? 'block' : 'none';
        document.getElementById('terms-field').style.display = isSignUp ? 'flex' : 'none';
        document.getElementById('marketing-field').style.display = isSignUp ? 'flex' : 'none';
        if (!isSignUp) document.getElementById('marketing-checkbox').checked = false;
        if (!isSignUp) document.getElementById('terms-checkbox').checked = false;
        document.getElementById('password').autocomplete = isSignUp ? 'new-password' : 'current-password';
        if (isForgot) {
          document.getElementById('toggle-text').textContent = '';
          document.getElementById('toggle-link').textContent = '← Back to sign in';
        } else if (isSignUp) {
          document.getElementById('toggle-text').textContent = 'Already have an account?';
          document.getElementById('toggle-link').textContent = 'Sign in';
        } else {
          document.getElementById('toggle-text').textContent = "Don't have an account?";
          document.getElementById('toggle-link').textContent = 'Create one';
        }
        hideError();
        document.getElementById('success-msg').style.display = 'none';
      }

      // The markup is the sign-in form, and setMode is what turns it into the
      // others — so ?mode=signup has to be applied, not just recorded. Without
      // this the page would show Sign In while the code believed it was on
      // sign-up, and the name and terms it validates would both be hidden.
      setMode(mode);
      document.querySelectorAll('#mode-tabs button').forEach(b =>
        b.addEventListener('click', () => { setMode(b.dataset.mode); document.getElementById('email').focus(); }));
      document.getElementById('hero-create').addEventListener('click', () => {
        setMode('signup'); document.getElementById('name').focus();
      });

      document.getElementById('toggle-link').addEventListener('click', () => {
        setMode(mode === 'signin' ? 'signup' : 'signin');
      });

      document.getElementById('forgot-link').addEventListener('click', () => {
        setMode('forgot');
      });

      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
      }
      function hideError() {
        document.getElementById('error-msg').style.display = 'none';
      }

      // ── Lost-email help ──────────────────────────────────────────────────
      // Confirmation and reset emails can land in spam or get held by a strict
      // mail server. Every "we emailed you" message says where it comes from and
      // offers a resend, so nobody is stuck with no way forward.
      const FROM_HINT = 'It can take a minute. Check your spam folder, and look for an email from info@popcodeapp.com.';
      const RESEND_WAIT = 60;   // seconds; Supabase refuses faster repeats anyway

      // el: #error-msg or #success-msg. Built with textContent — the email is
      // user input and never goes through innerHTML.
      function showNotice(el, text, opts) {
        opts = opts || {};
        el.textContent = text;
        if (opts.hint) {
          const h = document.createElement('span');
          h.className = 'notice-hint'; h.textContent = opts.hint;
          el.appendChild(h);
        }
        if (opts.resend) {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'notice-btn';
          el.appendChild(b);
          wireResend(b, opts.resend.label, opts.resend.send, opts.resend.coolFirst);
        }
        el.style.display = 'block';
        // It can sit below the button, off-screen on a laptop — bring it into view.
        try { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
      }
      function showSuccess(text, opts) { hideError(); showNotice(document.getElementById('success-msg'), text, opts); }
      function showErrorNotice(text, opts) {
        document.getElementById('success-msg').style.display = 'none';
        showNotice(document.getElementById('error-msg'), text, opts);
      }

      // A resend button with a countdown. coolFirst: an email was only just
      // sent, so start in the waiting state.
      function wireResend(btn, label, send, coolFirst) {
        let timer = null;
        function cool() {
          let left = RESEND_WAIT;
          btn.disabled = true;
          btn.textContent = label + ' (' + left + 's)';
          timer = setInterval(() => {
            left -= 1;
            if (left <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = label; }
            else btn.textContent = label + ' (' + left + 's)';
          }, 1000);
        }
        btn.textContent = label;
        if (coolFirst) cool();
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Sending…';
          const { error } = await send();
          if (error) { btn.disabled = false; btn.textContent = label; alert(friendlyError(error)); return; }
          cool();
        });
      }

      function resendConfirmation(email) {
        return db.auth.resend({ type: 'signup', email,
          options: { emailRedirectTo: window.location.origin + landingPage() } });
      }
      function sendReset(email) {
        return db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset.html' });
      }

      // Supabase's raw messages, in plain words.
      function isUnconfirmed(error) {
        return error && (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message || ''));
      }
      function friendlyError(error) {
        const m = (error && error.message) || '';
        if (error && (error.code === 'invalid_credentials' || /invalid login credentials/i.test(m)))
          return "That email and password don't match. Check them, or use Forgot password.";
        if ((error && error.status === 429) || /rate limit|too many|security purposes/i.test(m))
          return 'Too many attempts in a short time. Wait a minute, then try again.';
        if (/already registered|already been registered|user already exists/i.test(m))
          return 'There is already an account with that email. Sign in instead, or use Forgot password.';
        if (/password should be at least/i.test(m))
          return 'Your password needs to be at least 6 characters.';
        if (/invalid.*email|email.*invalid|unable to validate email/i.test(m))
          return "That doesn't look like a valid email address.";
        return m || 'Something went wrong. Please try again.';
      }

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value.trim();
        hideError();

        if (mode === 'forgot') {
          if (!email) {
            showError('Please enter your email.');
            return;
          }
          const btn = document.getElementById('submit-btn');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          const { error } = await sendReset(email);
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
          if (error) {
            showErrorNotice(friendlyError(error));
          } else {
            // Worded so it doesn't reveal whether the address has an account.
            showSuccess('If there’s an account for ' + email + ', a reset link is on its way.', {
              hint: FROM_HINT,
              resend: { label: 'Resend email', send: () => sendReset(email), coolFirst: true },
            });
          }
          return;
        }

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }
        if (mode === 'signup' && !name) {
          showError('Please enter your name.');
          return;
        }
        if (mode === 'signup' && !document.getElementById('terms-checkbox').checked) {
          showError('Please accept the Terms & Conditions to continue.');
          return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = mode === 'signup' ? 'Creating account...' : 'Signing in...';

        let error;
        if (mode === 'signup') {
          let signUpData;
          // The consent time is stored with the answer: it's the record of
          // when they agreed if anyone ever asks.
          const optIn = document.getElementById('marketing-checkbox').checked;
          const meta = { full_name: name, marketing_opt_in: optIn };
          if (optIn) meta.marketing_opt_in_at = new Date().toISOString();
          // The confirmation link returns them to where they were heading (a shop
          // product, say) rather than the homepage. popcode.app/** is on the
          // Supabase redirect allow list, which covers every page.
          ({ data: signUpData, error } = await db.auth.signUp({ email, password,
            options: { data: meta, emailRedirectTo: window.location.origin + landingPage() } }));
          if (!error) {
            // signUp returns the user even while the confirmation is pending,
            // so the top of the funnel is captured whether or not they confirm.
            logActivity('signup', { user_id: signUpData && signUpData.user && signUpData.user.id });
            showSuccess('Almost there. We sent a confirmation link to ' + email + '. Tap it, then sign in.', {
              hint: FROM_HINT,
              resend: { label: 'Resend email', send: () => resendConfirmation(email), coolFirst: true },
            });
            btn.disabled = false;
            btn.textContent = 'Create Account';
            return;
          }
        } else {
          ({ error } = await db.auth.signInWithPassword({ email, password }));
        }

        if (error) {
          if (isUnconfirmed(error)) {
            showErrorNotice('Please confirm your email first. We sent a link to ' + email + ' when you signed up.', {
              hint: FROM_HINT,
              resend: { label: 'Resend confirmation email', send: () => resendConfirmation(email) },
            });
          } else {
            showErrorNotice(friendlyError(error));
          }
          btn.disabled = false;
          btn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
        } else {
          window.location.href = landingPage();
        }
      });

      // Allow Enter key to submit
      document.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('submit-btn').click();
      });
    </script>
  <script src="/beta-feedback.js"></script>
  </body>
</html>
