<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Sentry error monitoring (errors-only; init in /sentry-init.js) -->
    <script
      src="https://browser.sentry-cdn.com/10.59.0/bundle.min.js"
      integrity="sha384-V80tE+22zYqM17YuWTi3GmAl/uJSKuAi5ov4G1Y6Zyw9wvVwwv9zree5oYNbB5Rn"
      crossorigin="anonymous"></script>
    <script src="/sentry-init.js"></script>
    <link rel="icon" href="/assets/popcode_symbol_color.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/Popcode_logo.png">
    <meta property="og:title" content="Popcode">
    <meta property="og:description" content="Bring your photos to life with AR video">
    <meta property="og:image" content="https://popcode.app/assets/og_image.png?v=2">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>Popcode — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/activity.js"></script>
    <link rel="stylesheet" href="/assets/fonts.css">
    <style>
      @font-face {
        font-family: 'FilsonPro';
        src: url('/assets/fonts/FilsonProMedium/font.woff2') format('woff2'),
             url('/assets/fonts/FilsonProMedium/font.woff') format('woff');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'FilsonPro';
        src: url('/assets/fonts/FilsonProBold/font.woff2') format('woff2'),
             url('/assets/fonts/FilsonProBold/font.woff') format('woff');
        font-weight: 700;
        font-style: normal;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: #f7f6f2;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        color: #1a1a1a;
        overflow-x: hidden;
      }
      h1, h2, h3 { font-family: 'CooperBT', serif; font-weight: 400; }

      /* Split screen: the homepage hero carried through on the left, the form
         on the right, so arriving from the homepage feels like the same place. */
      .auth-shell { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; }
      .brand-panel {
        position: sticky; top: 0; height: 100vh; overflow: hidden;
        background: linear-gradient(160deg, #5bc8f5 0%, #7c3aed 100%);
        color: #fff; display: flex; flex-direction: column;
        padding: 36px clamp(32px, 5vw, 72px) 0;
      }
      .bp-logo img { height: 40px; display: block; }
      .bp-copy { margin-top: clamp(28px, 7vh, 80px); max-width: 460px; position: relative; z-index: 2; }
      .bp-title { font-size: clamp(44px, 5.4vw, 76px); line-height: .98; letter-spacing: -0.02em; }
      .bp-sub { margin-top: 18px; font-size: 18px; line-height: 1.5; opacity: .92; max-width: 400px; }
      .bp-stage { position: relative; flex: 1; min-height: 0; margin-top: 28px; }
      .bp-art {
        position: absolute; right: -6%; bottom: -4%; height: 92%; max-height: 560px; width: auto;
        filter: drop-shadow(0 30px 50px rgba(20, 8, 60, .35));
      }
      .bp-phone {
        position: absolute; left: 14%; bottom: 4%; z-index: 2;
        height: min(78%, 440px); aspect-ratio: 236 / 476;
        background: #16121f; border-radius: 13% / 6.4%; padding: 3.2%;
        box-shadow: 0 40px 80px rgba(10, 5, 40, .5);
      }
      .bp-screen { position: relative; width: 100%; height: 100%; border-radius: 11% / 5.4%; overflow: hidden; background: #1a1430; }
      .bp-screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .bp-notch { position: absolute; left: 50%; top: 2.2%; transform: translateX(-50%); width: 36%; height: 4.6%; border-radius: 12px; background: #16121f; }
      .bp-curve { display: none; }

      .form-side { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 24px; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .card { animation: rise .5s ease both; }
      .bp-copy { animation: rise .6s ease both; }
      .bp-phone { animation: rise .8s .15s ease both; }
      @media (prefers-reduced-motion: reduce) { .card, .bp-copy, .bp-phone { animation: none; } }

      /* Phones: the panel becomes the homepage's gradient band and curve, with
         no stage, so the form is still above the fold. */
      @media (max-width: 860px) {
        .auth-shell { grid-template-columns: 1fr; }
        .brand-panel { position: relative; height: auto; padding: 24px 24px 84px; }
        .bp-logo img { height: 32px; }
        .bp-copy { margin-top: 26px; }
        .bp-title { font-size: 44px; }
        .bp-sub { font-size: 16px; margin-top: 12px; }
        .bp-stage { display: none; }
        .bp-curve { display: block; position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 70px; }
        .form-side { justify-content: flex-start; padding: 0 20px 24px; margin-top: -44px; position: relative; z-index: 2; }
      }
      label { font-family: 'Inter', sans-serif; }
      .card {
        width: 100%;
        max-width: 400px;
        background: white;
        border-radius: 24px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(40, 20, 90, 0.10), 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #ecebe6;
      }
      h1 { font-size: 30px; margin-bottom: 24px; text-align: center; color: #1a1a1a; letter-spacing: -0.01em; }
      .field { margin-bottom: 16px; }
      label { font-size: 13px; font-weight: 700; color: #555; display: block; margin-bottom: 6px; }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; padding: 13px 16px; border-radius: 12px;
        border: 1px solid #e8e8e8;
        font-size: 15px; color: #1a1a1a; outline: none;
        font-family: 'Inter', sans-serif;
        background: #fafaf8;
      }
      .submit-btn {
        width: 100%; padding: 15px; border-radius: 30px; border: none;
        background: #1a1a1a;
        color: white; font-size: 16px; font-weight: 700;
        font-family: 'Inter', sans-serif;
        cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
      }
      .terms-field {
        display: flex; align-items: flex-start; gap: 10px;
        margin-bottom: 16px; font-size: 13px; color: #555; line-height: 1.5;
      }
      .terms-field input[type="checkbox"] {
        margin-top: 2px; flex-shrink: 0; width: 16px; height: 16px;
        accent-color: #7657FC; cursor: pointer;
      }
      .terms-field label { font-size: 13px; font-weight: 400; color: #555; margin: 0; cursor: pointer; }
      .terms-field a { color: #1a1a1a; text-decoration: underline; }
      footer {
        margin: 32px auto 0; padding: 16px; text-align: center;
        font-size: 12px; color: #888;
      }
      footer a { color: #888; text-decoration: underline; margin: 0 8px; }
      .submit-btn:hover { opacity: 0.9; }
      .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .toggle {
        margin-top: 20px; text-align: center; font-size: 13px; color: #888;
      }
      .toggle a { color: #1a1a1a; font-weight: 700; cursor: pointer; text-decoration: underline; }
      .forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
      .forgot a { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; }
      .forgot a:hover { color: #1a1a1a; }
      .error-msg {
        display: none; background: #fff0f0; border: 1px solid #ffcccc;
        border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
        line-height: 1.5; color: #cc3333;
      }
      .success-msg {
        display: none; background: #f0fff4; border: 1px solid #bbf7d0;
        border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
        line-height: 1.5; color: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
    <aside class="brand-panel">
      <a class="bp-logo" href="/"><img src="/assets/Popcode_logo.rev.svg" alt="Popcode"/></a>
      <div class="bp-copy">
        <h2 class="bp-title" id="bp-title">Welcome back.</h2>
        <p class="bp-sub" id="bp-sub">Sign in to make, share and order the things that play.</p>
      </div>
      <div class="bp-stage" aria-hidden="true">
        <img class="bp-art" src="/assets/mockups/scenes/exhibit.webp" alt=""/>
        <div class="bp-phone"><div class="bp-screen">
          <video src="/video/exhibit.mp4" poster="/assets/mockups/scenes/exhibit.webp" muted loop playsinline autoplay preload="metadata"></video>
          <div class="bp-notch"></div>
        </div></div>
      </div>
      <svg class="bp-curve" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 96 C 260 8, 700 -18, 1200 52 L1200 190 L0 190 Z" fill="#f7f6f2"/>
      </svg>
    </aside>
    <main class="form-side">
    <div class="card">
      <h1 id="form-title">Sign In</h1>
      <div class="error-msg" id="error-msg"></div>
      <div class="field" id="name-field" style="display:none;">
        <label for="name">Your Name</label>
        <input type="text" id="name" autocomplete="name" placeholder="First and last name"/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Password"/>
      </div>
      <div class="forgot" id="forgot-wrap">
        <a id="forgot-link">Forgot password?</a>
      </div>
      <div class="terms-field" id="terms-field" style="display:none;">
        <input type="checkbox" id="terms-checkbox"/>
        <label for="terms-checkbox">I agree to the <a href="/terms.html" target="_blank">Terms &amp; Conditions</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</label>
      </div>
      <button class="submit-btn" id="submit-btn">Sign In</button>
      <div class="toggle">
        <span id="toggle-text">Don't have an account?</span>
        <a id="toggle-link">Create one</a>
      </div>
      <div class="success-msg" id="success-msg"></div>
    </div>

    <footer>
      <a href="/terms.html">Terms</a> <span style="color:#ccc">·</span> <a href="/privacy.html">Privacy</a>
    </footer>
    </main>
    </div>

    <script>
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // Where to land after signing in. A page that bounced you here (e.g. the
      // cart) passes ?next=/cart.html so you continue where you left off rather
      // than being dumped on My Popcodes. Only a same-origin ABSOLUTE PATH is
      // accepted — "//evil.com" and "https://evil.com" are rejected, so this
      // can't be turned into an open redirect.
      function landingPage() {
        const next = new URLSearchParams(location.search).get('next');
        if (next && /^\/[^/\\]/.test(next)) return next;
        return '/manage.html';
      }

      // Redirect if already signed in
      db.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = landingPage();
      });

      // 'signin' | 'signup' | 'forgot'. ?mode=signup lets the places that
      // assume you do not have an account yet — Create a Popcode, buying a pack
      // — land on the sign-up form rather than making you find the toggle.
      let mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'signin';

      function setMode(newMode) {
        mode = newMode;
        const isSignUp = mode === 'signup';
        const isForgot = mode === 'forgot';
        const titles = { signin: 'Sign In', signup: 'Create Account', forgot: 'Reset Password' };
        const submitText = { signin: 'Sign In', signup: 'Create Account', forgot: 'Send Reset Link' };
        document.getElementById('form-title').textContent = titles[mode];
        const side = {
          signin: ['Welcome back.', 'Sign in to make, share and order the things that play.'],
          signup: ['Make anything play.', 'Point a phone at a photo, a print or a painting and video or voice plays from it. Your first five Popcodes are free.'],
          forgot: ['It happens.', 'Enter your email and we\'ll send you a link to set a new password.'],
        }[mode];
        document.getElementById('bp-title').textContent = side[0];
        document.getElementById('bp-sub').textContent = side[1];
        document.getElementById('submit-btn').textContent = submitText[mode];
        document.getElementById('name-field').style.display = isSignUp ? 'block' : 'none';
        document.getElementById('password').closest('.field').style.display = isForgot ? 'none' : 'block';
        document.getElementById('forgot-wrap').style.display = mode === 'signin' ? 'block' : 'none';
        document.getElementById('terms-field').style.display = isSignUp ? 'flex' : 'none';
        if (!isSignUp) document.getElementById('terms-checkbox').checked = false;
        document.getElementById('password').autocomplete = isSignUp ? 'new-password' : 'current-password';
        if (isForgot) {
          document.getElementById('toggle-text').textContent = '';
          document.getElementById('toggle-link').textContent = '← Back to sign in';
        } else if (isSignUp) {
          document.getElementById('toggle-text').textContent = 'Already have an account?';
          document.getElementById('toggle-link').textContent = 'Sign in';
        } else {
          document.getElementById('toggle-text').textContent = "Don't have an account?";
          document.getElementById('toggle-link').textContent = 'Create one';
        }
        hideError();
        document.getElementById('success-msg').style.display = 'none';
      }

      // The markup is the sign-in form, and setMode is what turns it into the
      // others — so ?mode=signup has to be applied, not just recorded. Without
      // this the page would show Sign In while the code believed it was on
      // sign-up, and the name and terms it validates would both be hidden.
      if (mode !== 'signin') setMode(mode);

      document.getElementById('toggle-link').addEventListener('click', () => {
        setMode(mode === 'signin' ? 'signup' : 'signin');
      });

      document.getElementById('forgot-link').addEventListener('click', () => {
        setMode('forgot');
      });

      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
      }
      function hideError() {
        document.getElementById('error-msg').style.display = 'none';
      }

      document.getElementById('submit-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value.trim();
        hideError();

        if (mode === 'forgot') {
          if (!email) {
            showError('Please enter your email.');
            return;
          }
          const btn = document.getElementById('submit-btn');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          const { error } = await db.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset.html'
          });
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
          if (error) {
            showError(error.message);
          } else {
            const s = document.getElementById('success-msg');
            s.textContent = 'Reset link sent — check your email.';
            s.style.display = 'block';
          }
          return;
        }

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }
        if (mode === 'signup' && !name) {
          showError('Please enter your name.');
          return;
        }
        if (mode === 'signup' && !document.getElementById('terms-checkbox').checked) {
          showError('Please accept the Terms & Conditions to continue.');
          return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = mode === 'signup' ? 'Creating account...' : 'Signing in...';

        let error;
        if (mode === 'signup') {
          let signUpData;
          ({ data: signUpData, error } = await db.auth.signUp({ email, password, options: { data: { full_name: name } } }));
          if (!error) {
            // signUp returns the user even while the confirmation is pending,
            // so the top of the funnel is captured whether or not they confirm.
            logActivity('signup', { user_id: signUpData && signUpData.user && signUpData.user.id });
            showError('Check your email for a confirmation link, then sign in.');
            btn.disabled = false;
            btn.textContent = 'Create Account';
            return;
          }
        } else {
          ({ error } = await db.auth.signInWithPassword({ email, password }));
        }

        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
        } else {
          window.location.href = landingPage();
        }
      });

      // Allow Enter key to submit
      document.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('submit-btn').click();
      });
    </script>
  <script src="/beta-feedback.js"></script>
  </body>
</html>
