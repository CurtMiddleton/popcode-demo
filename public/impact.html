            'Leave anything blank until it’s known.</p>' +
            '<form class="fields" id="results-form">' +
            '<label>Pieces mailed<input type="number" name="pieces" min="0" step="1" value="' + val('pieces') + '"></label>' +
            '<label>Print + postage<input type="number" name="cost" min="0" step="0.01" value="' + val('cost') + '"></label>' +
            '<label>Gifts<input type="number" name="gifts" min="0" step="1" value="' + val('gifts') + '"></label>' +
            '<label>Raised<input type="number" name="amount" min="0" step="0.01" value="' + val('amount') + '"></label>' +
            '<label>Currency<input class="cur" name="currency" maxlength="3" pattern="[A-Za-z]{3}" value="' + esc(r ? r.currency : 'USD') + '"></label>' +
            '<button class="tool-btn primary" type="submit">Save</button>' +
            (r ? '<button class="tool-btn" type="button" id="results-clear">Clear</button>' : '') +
            '</form><p class="tool-msg" id="results-msg">' +
            (r ? 'Last updated ' + esc(new Date(r.updated_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) : 'Not entered yet.') +
            '</p></div>';
          h += segmentsEditor(d);
          h += brandEditor(d);
        }
        if (d.can.share) {
          h += '<div class="card"><h2>Share with your board</h2><p class="lede">Anyone with a link sees this dashboard, read-only, ' +
            'without an account. Your own test scans are never included. Turn a link off at any time.</p>' +
            '<ul class="shares" id="shares"></ul>' +
            '<button class="tool-btn primary" type="button" id="share-new">Create a link</button>' +
            '<p class="tool-msg" id="share-msg"></p></div>';
        }
        return h + '</section>';
      }

      // Admin: the org's logo, name and colour. The colour previews as you pick.
      function brandEditor(d) {
        const b = d.brand || {}, c = d.campaign;
        const hex = b.color || DEFAULT_ACCENT;
        return '<div class="card"><h2>Branding</h2><p class="lede">The org’s logo leads the header, with “Powered by Popcode” beside it, ' +
          'and their colour replaces Popcode purple. Use a logo made for a light background. ' +
          'Applies to share links and the printed report too.</p>' +
          '<form class="fields brand-form" id="brand-form">' +
          '<div class="logo-pick"><div class="logo-box" id="brand-logo-box">' +
            (b.logo ? '<img src="' + esc(b.logo) + '" alt="">' : 'No logo') + '</div>' +
            '<input type="file" id="brand-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>' +
            '<button class="tool-btn" type="button" id="brand-logo-pick">Choose logo</button>' +
            '<button class="tool-btn" type="button" id="brand-logo-clear"' + (b.logo ? '' : ' hidden') + '>Remove</button></div>' +
          '<label>Organization name<input class="name" name="org" maxlength="80" value="' + esc(c.org_name || '') + '" placeholder="' + esc(c.name || '') + '"></label>' +
          '<label>Colour<input type="color" id="brand-color" value="' + esc(hex.toLowerCase()) + '"></label>' +
          '<label>Hex<input class="hex" id="brand-hex" maxlength="7" value="' + esc(hex.toUpperCase()) + '"></label>' +
          '<button class="tool-btn" type="button" id="brand-reset">Popcode purple</button>' +
          '<button class="tool-btn primary" type="submit">Save</button>' +
          '</form><p class="tool-msg" id="brand-msg"></p></div>';
      }

      function wireBrand(d) {
        const form = $('brand-form');
        if (!form) return;
        const slug = d.campaign.slug, msg = $('brand-msg');
        const saved = Object.assign({}, d.brand || {});
        let file = null, logo = saved.logo || null;
        const box = $('brand-logo-box');
        const showLogo = (src) => { box.innerHTML = src ? '<img src="' + esc(src) + '" alt="">' : 'No logo'; $('brand-logo-clear').hidden = !src; };
        const color = () => (HEX_RE.test($('brand-hex').value.trim()) ? $('brand-hex').value.trim() : null);
        $('brand-color').oninput = (e) => { $('brand-hex').value = e.target.value.toUpperCase(); applyColor(e.target.value); };
        $('brand-hex').oninput = (e) => {
          let v = e.target.value.trim(); if (v && v[0] !== '#') v = '#' + v;
          if (HEX_RE.test(v)) { $('brand-color').value = v.toLowerCase(); applyColor(v); }
        };
        $('brand-reset').onclick = () => { $('brand-hex').value = DEFAULT_ACCENT; $('brand-color').value = DEFAULT_ACCENT.toLowerCase(); applyColor(DEFAULT_ACCENT); };
        $('brand-logo-pick').onclick = () => $('brand-logo-file').click();
        $('brand-logo-file').onchange = (e) => {
          const f = e.target.files && e.target.files[0]; if (!f) return;
          file = f; showLogo(URL.createObjectURL(f));
        };
        $('brand-logo-clear').onclick = () => { file = null; logo = null; $('brand-logo-file').value = ''; showLogo(null); };
        form.onsubmit = async (e) => {
          e.preventDefault();
          let v = $('brand-hex').value.trim(); if (v && v[0] !== '#') v = '#' + v;
          if (v && !HEX_RE.test(v)) { msg.textContent = '“' + v + '” isn’t a colour like #FBB619.'; return; }
          const btn = form.querySelector('button[type=submit]'); btn.disabled = true; msg.textContent = 'Saving…';
          try {
            // Read the row fresh so nothing else in cover_config is overwritten.
            const cur = await db.from('collections').select('id, cover_config').eq('slug', slug).single();
            if (cur.error) throw cur.error;
            if (file) {
              const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
              const path = slug + '/dash_logo.' + ext;
              const up = await db.storage.from('experiences').upload(path, file, { upsert: true, contentType: file.type || 'image/png' });
              if (up.error) throw up.error;
              logo = db.storage.from('experiences').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
              file = null;
            }
            const hex = !v || v.toUpperCase() === DEFAULT_ACCENT.toUpperCase() ? null : v.toUpperCase();
            const org = form.org.value.trim() || null;
            const cfg = Object.assign({}, cur.data.cover_config || {}, { dash_logo_url: logo, brand_color: hex, org_name: org });
            const r = await db.from('collections').update({ cover_config: cfg }).eq('id', cur.data.id).select('id');
            if (r.error) throw r.error;
            if (!r.data || !r.data.length) throw new Error('No row updated — only the admin account can change branding.');
            state.brand = Object.assign({}, state.brand, { logo: logo, color: hex });
            state.campaign.org_name = org;
            Object.assign(saved, state.brand);
            rememberBrand(slug, state.brand);
            drawBrand();
            msg.textContent = 'Saved.';
          } catch (err) {
            msg.textContent = 'Not saved: ' + (err.message || err);
            applyColor(saved.color);
          } finally { btn.disabled = false; }
        };
      }

      function shareUrl(t) { return location.origin + '/impact.html?share=' + encodeURIComponent(t); }

      function drawShares() {
        const ul = $('shares');
        if (!ul) return;
        const all = Array.isArray(state.shares) ? state.shares : [];
        const live = all.filter((s) => !s.revoked_at);
        const off = all.length - live.length;
        ul.innerHTML = live.length ? live.map((s) =>
          '<li><code>' + esc(shareUrl(s.token)) + '</code>' +
          '<button class="tool-btn" type="button" data-copy="' + esc(s.token) + '">Copy</button>' +
          '<button class="tool-btn" type="button" data-revoke="' + esc(s.token) + '">Turn off</button>' +
          '<small>Made ' + esc(new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })) + '</small></li>'
        ).join('') : '<li><small>No active links.' + (off ? ' ' + off + ' turned off.' : '') + '</small></li>';
      }

      async function loadShares() {
        const r = await db.rpc('list_impact_shares', { p_slug: state.campaign.slug });
        if (r.error) { const m = $('share-msg'); if (m) m.textContent = 'Couldn’t load links: ' + r.error.message; return; }
        state.shares = r.data || [];
        drawShares();
      }

      function wireManage(d) {
        drawShares();
        wireBrand(d);
        const slug = d.campaign.slug;
        const form = $('results-form');
        if (form) {
          form.onsubmit = async (e) => {
            e.preventDefault();
            const b = form.querySelector('button[type=submit]'); b.disabled = true;
            const n = (el, int) => (el.value === '' ? null : int ? parseInt(el.value, 10) : parseFloat(el.value));
            const r = await db.rpc('set_campaign_results', { p_slug: slug,
              p_gifts: n(form.gifts, true), p_amount: n(form.amount), p_currency: (form.currency.value || 'USD').toUpperCase(),
              p_pieces: n(form.pieces, true), p_cost: n(form.cost) });
            b.disabled = false;
            if (r.error) { $('results-msg').textContent = 'Not saved: ' + r.error.message; return; }
            load(slug);
          };
          const clr = $('results-clear');
          if (clr) clr.onclick = async () => {
            if (!confirm('Clear the campaign numbers (pieces, cost, gifts) for this campaign?')) return;
            const r = await db.rpc('clear_campaign_results', { p_slug: slug });
            if (r.error) { $('results-msg').textContent = 'Not cleared: ' + r.error.message; return; }
            load(slug);
          };
        }
        const sf = $('segments-form');
        if (sf) {
          drawRedirects(d);
          $('seg-rows').addEventListener('input', () => drawRedirects(d));
          $('seg-add').onclick = () => {
            $('seg-rows').insertAdjacentHTML('beforeend', segRow({ code: '', label: '', pieces: null }));
            const last = $('seg-rows').lastElementChild; if (last) last.querySelector('.code').focus();
          };
          $('seg-rows').onclick = (e) => { const b = e.target.closest('[data-remove]'); if (b) { b.parentElement.remove(); drawRedirects(d); } };
          sf.onsubmit = async (e) => {
            e.preventDefault();
            const list = [...sf.querySelectorAll('.seg-row')].map((row) => ({
              code: row.querySelector('.code').value.trim().toLowerCase(),
              label: row.querySelector('.label').value.trim(),
              pieces: row.querySelector('.pieces').value === '' ? null : parseInt(row.querySelector('.pieces').value, 10),
            })).filter((x) => x.code);
            const bad = list.find((x) => !/^[a-z0-9][a-z0-9-]{0,19}$/.test(x.code));
            if (bad) { $('seg-msg').textContent = '“' + bad.code + '” isn’t a valid code.'; return; }
            const b = sf.querySelector('button[type=submit]'); b.disabled = true;
            const r = await db.rpc('set_campaign_segments', { p_slug: slug, p_segments: list });
            b.disabled = false;
            if (r.error) { $('seg-msg').textContent = 'Not saved: ' + r.error.message; return; }
            load(slug);
          };
        }
        const add = $('share-new');
        if (add) add.onclick = async () => {
          add.disabled = true;
          const r = await db.rpc('create_impact_share', { p_slug: slug });
          add.disabled = false;
          if (r.error) { $('share-msg').textContent = 'Couldn’t create a link: ' + r.error.message; return; }
          await loadShares();
          copy(shareUrl(r.data), 'Link created and copied.');
        };
        const ul = $('shares');
        if (ul) ul.onclick = async (e) => {
          const c = e.target.closest('[data-copy]'), v = e.target.closest('[data-revoke]');
          if (c) copy(shareUrl(c.dataset.copy), 'Copied.');
          if (v) {
            if (!confirm('Turn this link off? Anyone who has it will lose access.')) return;
            const r = await db.rpc('revoke_impact_share', { p_token: v.dataset.revoke });
            if (r.error) { $('share-msg').textContent = 'Couldn’t turn it off: ' + r.error.message; return; }
            await loadShares();
            $('share-msg').textContent = 'Link turned off.';
          }
        };
      }

      async function copy(text, done) {
        const m = $('share-msg');
        try { await navigator.clipboard.writeText(text); if (m) m.textContent = done; }
        catch (e) { if (m) m.textContent = text; }
      }

      start().catch(fail);
    </script>
  </body>
</html>
