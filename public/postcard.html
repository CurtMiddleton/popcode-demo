<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popcode Companion Postcard</title>

<!-- CooperBT (self-hosted, base64) + Inter (Google). See docs/postcard-brief.md. -->
<link rel="stylesheet" href="/assets/fonts.css">

<style>
  /* ══════════════════════════════════════════════════════════════════
     COMPANION POSTCARD — production artboard / renderer.

     Everything inside .pc-card is sized in absolute print units (in / pt),
     so the artboard on screen IS the printed card. Screen zoom is applied
     with transform: scale() on a wrapper, which never touches type metrics.

     Card geometry comes from CARD in the script below and is written onto
     .pc-card as custom properties. Change the size there (or via ?w=&h=)
     and the whole layout re-derives — nothing is hard-coded to 4×6.
     ══════════════════════════════════════════════════════════════════ */

  :root {
    --stage-bg:   #e8e6e1;
    --bar-bg:     rgba(255,255,255,.86);
    --bar-line:   rgba(0,0,0,.08);
    --bar-ink:    #3a3731;
    --bar-strong: #17150f;
    --bar-dim:    #8a857c;

    --ink:      #17150f;   /* near-black, warm — matches book back cover #1a1a1a family */
    --ink-soft: #6b665d;   /* body gray, lifted from .bc-inst */
    --cyan:     #2dc0f7;
    --blue:     #5f8dfa;
    --purple:   #8131fe;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage-bg:   #1c1b19;
      --bar-bg:     rgba(30,29,27,.9);
      --bar-line:   rgba(255,255,255,.1);
      --bar-ink:    #cdc8bf;
      --bar-strong: #f3f0ea;
      --bar-dim:    #8a857c;
    }
  }
  :root[data-theme="dark"] {
    --stage-bg:   #1c1b19;
    --bar-bg:     rgba(30,29,27,.9);
    --bar-line:   rgba(255,255,255,.1);
    --bar-ink:    #cdc8bf;
    --bar-strong: #f3f0ea;
    --bar-dim:    #8a857c;
  }

  /* ── Artboard chrome (screen only — stripped before any capture) ── */
  html, body { margin: 0; }
  body {
    background: var(--stage-bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--bar-ink);
    -webkit-font-smoothing: antialiased;
  }
  .pc-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px;
    background: var(--bar-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--bar-line);
    font-size: 13px;
  }
  .pc-bar strong { font-weight: 600; color: var(--bar-strong); }
  .pc-bar .dim { color: var(--bar-dim); }
  .pc-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .pc-stage { padding: 40px 16px 80px; display: flex; gap: 52px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .pc-slot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .pc-slot figcaption { font-size: 12px; color: var(--bar-dim); letter-spacing: .04em; text-transform: uppercase; }
  .pc-zoom { transform-origin: top center; }

  /* ── The card ──────────────────────────────────────────────────── */
  .pc-card {
    /* --w/--h = TRIM size. --bleed extends past it on every edge. */
    position: relative;
    box-sizing: border-box;
    width:  calc(var(--w) + var(--bleed) * 2);
    height: calc(var(--h) + var(--bleed) * 2);
    background: #fff;
    /* Bleed + safe margin together give the live-content inset. */
    padding: calc(var(--bleed) + var(--margin));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;   /* content group optically centred */
    text-align: center;
    overflow: hidden;
  }
  .pc-shadow { box-shadow: 0 10px 34px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08); }

  /* Headline — CooperBT, the brand display face. */
  .pc-head {
    font-family: 'CooperBT', Georgia, 'Times New Roman', serif;
    font-weight: 300;              /* the only weight in fonts.css */
    color: var(--ink);
    font-size: var(--head-size);
    line-height: 1.0;
    letter-spacing: -0.005em;
    margin: 0;
    white-space: nowrap;
  }

  /* Gradient hairline — the only colour on the card besides the symbol. */
  .pc-rule {
    width: var(--rule-w);
    height: var(--rule-h);
    border-radius: 999px;
    background: linear-gradient(to right, var(--cyan), var(--blue) 52%, var(--purple));
  }

  /* The sentence. One line of copy, two emphasised spans. */
  .pc-copy {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: var(--copy-size);
    line-height: var(--copy-lead);
    max-width: var(--copy-w);
    letter-spacing: -0.005em;
    margin: 0;
    text-wrap: balance;
  }
  .pc-copy b { font-weight: 600; color: var(--ink); }
  .pc-url    { white-space: nowrap; }

  /* Brand lockup — symbol + wordmark, per docs/postcard-brief.md. */
  .pc-lockup {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(var(--bleed) + var(--margin));
    display: flex; align-items: center; justify-content: center;
    gap: var(--lock-gap);
  }
  .pc-symbol { width: var(--symbol-w); height: var(--symbol-w); display: block; }
  .pc-mark   { width: var(--mark-w);   height: auto;            display: block; }

  /* Spacers, declared so the vertical rhythm reads in one place. */
  .pc-sp { flex: 0 0 auto; }
  .pc-group {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: var(--optical-lift);   /* optical centring */
  }

  /* ── Guides (screen only) ──────────────────────────────────────── */
  .pc-guides { position: absolute; inset: 0; pointer-events: none; }
  .pc-guides::before {   /* trim */
    content: ''; position: absolute;
    inset: var(--bleed);
    outline: 1px solid rgba(217,45,45,.5);
  }
  .pc-guides::after {    /* safe zone */
    content: ''; position: absolute;
    inset: calc(var(--bleed) + var(--margin));
    outline: 1px dashed rgba(45,120,217,.45);
  }
  .pc-card.no-guides .pc-guides { display: none; }
</style>
</head>
<body>

<div class="pc-bar">
  <strong>Companion postcard</strong>
  <span class="dim" id="pc-meta"></span>
  <label><input type="checkbox" id="pc-g" checked> Guides <span class="dim">(red&nbsp;trim · blue&nbsp;safe)</span></label>
  <label><input type="checkbox" id="pc-s" checked> Card shadow</label>
  <label>Zoom <input type="range" id="pc-z" min="40" max="260" value="175" style="width:110px"> <span class="dim" id="pc-zv">175%</span></label>
</div>

<div class="pc-stage" id="pc-stage"></div>

<script>
/* ════════════════════════════════════════════════════════════════════
   CARD SPEC — the single source of truth for the printed artwork.

   Every length is absolute print units. `in` for geometry, `pt` for type
   (1pt = 1/72in), so the numbers below are literally what goes to press.
   ════════════════════════════════════════════════════════════════════ */
const CARD = {
  wIn: 4,             // trim width
  hIn: 6,             // trim height
  bleedIn: 0.125,     // 3mm — standard; confirm against the chosen Prodigi SKU
  marginIn: 0.42,     // safe margin inside trim

  /* Headline auto-fits the card: the largest size that keeps "Scan & Play" on
     one line at headFill of the safe width, capped at headMaxPt. This is what
     lets one spec survive a change of card size (still OPEN in the brief) and
     guarantees the line never collides with the safe margin. */
  headMaxPt: 46,
  headFill:  0.88,    // share of the safe column the headline may occupy

  ruleWIn: 0.68,      // gradient hairline
  ruleHPt: 2.5,
  copyPt:  11,        // the sentence — Inter
  copyLead: 1.55,
  copyWIn: 2.62,      // measure — keeps the sentence to a comfortable line length

  markWIn:   1.12,    // Popcode wordmark (book back cover prints it at 1.25")
  symbolWIn: 0.36,    // Popcode symbol
  lockGapIn: 0.15,

  // Vertical rhythm.
  gapHeadRuleIn: 0.20,
  gapRuleCopyIn: 0.30,

  // Optical lift: how far the centred content group sits above true centre, so
  // the footer lockup reads as a footer rather than crowding the copy.
  opticalLiftIn: 0.55,
};

/* Copy — settled in docs/postcard-brief.md. Do not paraphrase:
   "Play" covers audio and video; "Scan image" must match the button exactly. */
const COPY = {
  head: 'Scan & Play',
  line: (slug) =>
    `Go to <b class="pc-url">popcode.app/${slug}</b> on your phone and hit <b>Scan&nbsp;image</b>.`,
};

/**
 * Build one card element at real print dimensions.
 * @param {object} o
 * @param {string} o.slug      the per-order slug — the whole reason this card exists
 * @param {number} [o.wIn]     trim width  (defaults to CARD.wIn)
 * @param {number} [o.hIn]     trim height (defaults to CARD.hIn)
 * @param {boolean} [o.guides] draw trim/safe guides (screen only — never for print)
 */
function buildPostcard(o) {
  const wIn = o.wIn != null ? o.wIn : CARD.wIn;
  const hIn = o.hIn != null ? o.hIn : CARD.hIn;

  const el = document.createElement('div');
  el.className = 'pc-card' + (o.guides ? '' : ' no-guides');
  el.style.cssText = [
    `--w:${wIn}in`,
    `--h:${hIn}in`,
    `--bleed:${CARD.bleedIn}in`,
    `--margin:${CARD.marginIn}in`,
    `--head-size:${CARD.headMaxPt}pt`,      // provisional — fitHeadline() corrects it
    `--rule-w:${CARD.ruleWIn}in`,
    `--rule-h:${CARD.ruleHPt}pt`,
    `--copy-size:${CARD.copyPt}pt`,
    `--copy-lead:${CARD.copyLead}`,
    `--copy-w:${CARD.copyWIn}in`,
    `--mark-w:${CARD.markWIn}in`,
    `--symbol-w:${CARD.symbolWIn}in`,
    `--lock-gap:${CARD.lockGapIn}in`,
    `--optical-lift:${CARD.opticalLiftIn}in`,
  ].join(';');

  el.innerHTML = `
    <div class="pc-group">
      <h1 class="pc-head">${COPY.head}</h1>
      <div class="pc-sp" style="height:${CARD.gapHeadRuleIn}in"></div>
      <div class="pc-rule"></div>
      <div class="pc-sp" style="height:${CARD.gapRuleCopyIn}in"></div>
      <p class="pc-copy">${COPY.line(o.slug)}</p>
    </div>

    <div class="pc-lockup">
      <img class="pc-symbol" src="/assets/popcode_symbol_color.svg" alt="">
      <img class="pc-mark"   src="/assets/Popcode_logo.png" alt="Popcode">
    </div>

    <div class="pc-guides"></div>
  `;
  return el;
}

/**
 * Size the headline to the card. Measures the rendered text and scales it to
 * CARD.headFill of the safe column, capped at CARD.headMaxPt, so "Scan & Play"
 * always sits on one line with honest margins at any card size.
 *
 * Must run after document.fonts.ready — measuring against a fallback face
 * gives the wrong answer (CooperBT is ~6% wider than Georgia).
 * @returns {number} the pt size applied
 */
function fitHeadline(card) {
  const head = card.querySelector('.pc-head');
  const cs = getComputedStyle(card);
  const px = v => parseFloat(v);

  // Unscale: rects are post-transform, computed padding is not. Mixing the two
  // silently overstates the safe column and the headline overruns the margin.
  const rect = card.getBoundingClientRect();
  const scale = rect.width / card.offsetWidth || 1;
  const safeW = card.offsetWidth - (px(cs.paddingLeft) + px(cs.paddingRight));

  const rng = document.createRange();
  rng.selectNodeContents(head);
  const natural = rng.getBoundingClientRect().width / scale;
  if (!natural) return CARD.headMaxPt;

  const fitted = CARD.headMaxPt * (safeW * CARD.headFill) / natural;
  const pt = Math.min(CARD.headMaxPt, Math.round(fitted * 10) / 10);
  card.style.setProperty('--head-size', pt + 'pt');
  return pt;
}

/* ── Artboard ─────────────────────────────────────────────────────── */
const qs = new URLSearchParams(location.search);
const SLUG = qs.get('slug') || 'my972d7m';

const VIEWS = [
  { label: 'Portrait 4 × 6 in', wIn: 4, hIn: 6 },
  { label: 'Landscape 6 × 4 in', wIn: 6, hIn: 4 },
];

function renderStage() {
  const stage = document.getElementById('pc-stage');
  const guides = document.getElementById('pc-g').checked;
  const shadow = document.getElementById('pc-s').checked;
  const zoom   = +document.getElementById('pc-z').value / 100;
  const fitted = [];

  stage.innerHTML = '';
  VIEWS.forEach(v => {
    const card = buildPostcard({ slug: SLUG, wIn: v.wIn, hIn: v.hIn, guides });
    if (shadow) card.classList.add('pc-shadow');

    // Scale from top-left and reserve the exact scaled footprint, so a scaled
    // card can't overhang its neighbour (it did when origin was top-center).
    const zoomBox = document.createElement('div');
    zoomBox.className = 'pc-zoom';
    zoomBox.style.transformOrigin = 'top left';
    zoomBox.style.transform = `scale(${zoom})`;
    zoomBox.appendChild(card);

    const hold = document.createElement('div');
    hold.style.position = 'relative';
    hold.style.width  = ((v.wIn + CARD.bleedIn * 2) * 96 * zoom) + 'px';
    hold.style.height = ((v.hIn + CARD.bleedIn * 2) * 96 * zoom) + 'px';
    hold.appendChild(zoomBox);

    const fig = document.createElement('figure');
    fig.className = 'pc-slot';
    fig.style.margin = '0';
    fig.appendChild(hold);
    const cap = document.createElement('figcaption');
    cap.textContent = v.label;
    fig.appendChild(cap);
    stage.appendChild(fig);

    fitted.push({ v, card, cap });
  });

  // Fit headlines only once the real faces are in — see fitHeadline().
  document.fonts.ready.then(() => {
    fitted.forEach(({ v, card, cap }) => {
      const pt = fitHeadline(card);
      cap.textContent = `${v.label} — headline ${pt}pt`;
    });
  });

  document.getElementById('pc-meta').textContent =
    `bleed ${CARD.bleedIn}in · safe ${CARD.marginIn}in · `
    + `headline CooperBT auto-fit (max ${CARD.headMaxPt}pt) · `
    + `copy ${CARD.copyPt}/${(CARD.copyPt * CARD.copyLead).toFixed(1)}pt Inter`;
  document.getElementById('pc-zv').textContent = Math.round(zoom * 100) + '%';
}

/**
 * Pick a starting zoom that fits the widest card in the viewport, so the
 * artboard is legible on a phone as well as a desktop. Manual zoom wins after
 * the first interaction.
 */
let zoomTouched = false;
function autoZoom() {
  if (zoomTouched) return;
  const avail = Math.min(window.innerWidth - 48, 900);
  const widest = Math.max(...VIEWS.map(v => v.wIn + CARD.bleedIn * 2)) * 96;
  const z = Math.round(Math.max(40, Math.min(260, (avail / widest) * 100)));
  document.getElementById('pc-z').value = z;
}

['pc-g','pc-s'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderStage));
document.getElementById('pc-z').addEventListener('input', () => {
  zoomTouched = true; renderStage();
});
window.addEventListener('resize', () => { autoZoom(); renderStage(); });

autoZoom();
renderStage();
document.fonts.ready.then(renderStage);
</script>
</body>
</html>
