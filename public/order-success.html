<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script
      src="https://browser.sentry-cdn.com/10.59.0/bundle.min.js"
      integrity="sha384-V80tE+22zYqM17YuWTi3GmAl/uJSKuAi5ov4G1Y6Zyw9wvVwwv9zree5oYNbB5Rn"
      crossorigin="anonymous"></script>
    <script src="/sentry-init.js"></script>
    <link rel="icon" href="/assets/popcode_symbol_color.svg" type="image/svg+xml">
    <title>Popcode — Order Placed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <link rel="stylesheet" href="/assets/fonts.css">
    <link rel="stylesheet" href="/ui.css">
    <style>
      * { box-sizing:border-box; margin:0; padding:0; }
      body { min-height:100vh; background:#f9f9f9; font-family:'Inter',sans-serif; color:#1a1a1a; display:flex; flex-direction:column; }
      .content { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
      .box { background:#fff; border-radius:var(--pc-radius-card); padding:48px 40px; max-width:440px; width:100%; text-align:center; box-shadow:var(--pc-shadow-card); }
      .check { width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,#589AF9 0%,#2dc0f7 100%); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; box-shadow:0 6px 18px rgba(45,192,247,0.26); }
      /* 30px, not the --pc-h1 token: the box is 440px wide less 40px of padding
         either side, so 360px of content, and "Thanks, payment received!" needs
         350px at 30px and 374px at 32px. This is the largest size that holds the
         sentence on one line. Below ~680px the box narrows to ~262px and it wraps
         after "Thanks," — deliberate, since fitting one line there would mean a
         22px headline, and at 320px no readable size fits at all. */
      h1 { font-family:'CooperBT', Georgia, serif; font-weight:400; font-size:30px; line-height:1.15; letter-spacing:-0.01em; margin-bottom:12px; }
      p { color:#6b7280; font-size:15px; line-height:1.6; margin:0 auto; max-width:330px; }
      .status { display:inline-block; margin-top:20px; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:500; letter-spacing:0.01em; background:#eef4ff; color:#3f66b0; }
      /* Geometry comes from /ui.css. The gradient fill is this page's own —
         it is the confirmation screen's one flourish. The shadow is dropped:
         buttons do not cast them, .btn-float excepted. */
      .btn { margin-top:28px; color:#fff;
             background:linear-gradient(135deg,#589AF9 0%,#2dc0f7 100%); }
      .after { display:inline-block; margin-top:16px; font-size:14px; font-weight:600;
               color:#6b6760; text-decoration:none; border-bottom:1px solid #d9d5cd; }
      .after:hover { color:#1a1a1a; border-bottom-color:#1a1a1a; }
      .btn:hover { opacity:.92; background:linear-gradient(135deg,#589AF9 0%,#2dc0f7 100%); }
      .muted { color:#9aa0aa; font-size:12.5px; margin-top:16px; letter-spacing:0.02em; }
      /* On the narrowest phones the box's 40px side padding leaves 192px of
         content, which broke the heading over three lines. Trimming the gutters
         buys enough width to hold it to two. Kept last in the file: an equally
         specific rule only wins from later in the source. */
      @media (max-width: 420px) {
        .content { padding:32px 16px; }
        .box { padding:40px 24px; }
      }
    </style>
  </head>
  <body>
    <script src="/nav.js"></script>
    <main class="content">
      <div class="box">
        <div class="check">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1>Thanks, payment received!</h1>
        <p>Your print order is on its way to production. We'll email you when it ships.</p>
        <div class="status" id="status">Finalizing…</div>
        <div>
          <!-- Tracking and per-parcel status live on /orders.html, so that is the
               primary action here; the old destination stays as the secondary. -->
          <a class="btn" href="/orders.html">Track this order</a>
        </div>
        <div><a class="after" href="/manage.html">Back to My Popcodes</a></div>
        <div class="muted" id="ref"></div>
      </div>
    </main>

    <script>
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      // /cart.js is injected by nav.js and picks this up instead of making its own.
      window.__popcodeCartDb = db;
      const sessionId = new URLSearchParams(location.search).get('session_id');

      const LABELS = {
        pending: 'Finalizing payment…',
        paid: 'Payment confirmed — submitting to print',
        submitted: 'Submitted to print',
        in_production: 'In production',
        shipped: 'Shipped',
        complete: 'Complete',
        prodigi_failed: 'Payment received — we hit a snag submitting to print; our team is on it.',
        payment_failed: 'Payment did not complete.',
      };

      function showStatus(status, prodigiOrderId) {
        document.getElementById('status').textContent = LABELS[status] || status || 'Order placed';
        if (prodigiOrderId) document.getElementById('ref').textContent = 'Order ref: ' + prodigiOrderId;
      }

      // A cart checkout can produce several provider orders (one per workshop).
      // Show them as one purchase: the weakest status wins, refs are listed.
      const STATUS_RANK = { prodigi_failed: 0, payment_failed: 0, pending: 1, paid: 1, submitting: 1, submitted: 2, in_production: 3, shipped: 4, complete: 5 };
      function showOrders(list) {
        const worst = list.reduce((a, o) => (STATUS_RANK[o.status] ?? 9) < (STATUS_RANK[a.status] ?? 9) ? o : a, list[0]);
        showStatus(worst.status);
        const refs = list.map((o) => o.prodigi_order_id).filter(Boolean);
        if (refs.length) {
          document.getElementById('ref').textContent =
            (refs.length > 1 ? 'Order refs: ' : 'Order ref: ') + refs.join(', ');
        }
      }

      // Payment is real, so the cart it came from is spent. Clearing here (not
      // before the Stripe redirect) means an abandoned or failed payment leaves
      // the cart intact.
      async function clearCartIfPaid() {
        try {
          // nav.js injects /cart.js deferred, so give it a moment to appear.
          for (let i = 0; i < 20 && !window.PopcodeCart; i++) await new Promise(r => setTimeout(r, 100));
          if (window.PopcodeCart) await PopcodeCart.clear();
          sessionStorage.removeItem('popcode_cart_pending');
        } catch (e) {}
      }

      // Drive finalization from the success page (independent of the webhook).
      async function finalize(token) {
        const resp = await fetch('/api/finalize-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ sessionId }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Finalize failed');
        return data;
      }

      db.auth.getSession().then(async ({ data }) => {
        if (!sessionId) { showStatus('submitted'); return; }
        const token = data.session?.access_token;
        if (!token) { showStatus('submitted'); return; }
        try {
          const result = await finalize(token);
          if (Array.isArray(result.orders) && result.orders.length) showOrders(result.orders);
          else showStatus(result.status, result.prodigi_order_id);
          await clearCartIfPaid();
        } catch (e) {
          // Fall back to reading the rows (the webhook may finalize them instead).
          const { data: rows } = await db.from('print_orders')
            .select('status, prodigi_order_id').eq('stripe_session_id', sessionId);
          if (rows && rows.length) { showOrders(rows); await clearCartIfPaid(); }
          else showStatus('submitted');
        }
      });
    </script>
  </body>
</html>
