<!doctype html>
<!--
  Source for public/assets/at-work-audio-tour.pdf: the /exhibitions "Try it
  yourself" handout. Three Letter pages, one work each, hung in a drawn gilt
  frame. Build with build.mjs (see README.md next to this file).

  The images MUST be the same files uploaded to the demo Popcode
  (public/assets/exh-try-*.jpg), or scanning won't match. The frame sits
  outside the image and never covers it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>At Work: audio tour demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; color: #2a2723; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .page { width: 8.5in; height: 11in; padding: 0.5in 0.6in 0.45in; display: flex; flex-direction: column;
          page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid #d9d4ca; }
  .mark { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 17px; letter-spacing: 0.28em; text-transform: uppercase; }
  .show { font-family: 'Cormorant Garamond', serif; font-size: 16px; }
  .show b { font-weight: 700; font-size: 18px; margin-right: 6px; }
  .show i { font-weight: 600; }

  /* The wall: a pale gallery grey, the work hung in the middle of it. */
  .wall { flex: 1; margin: 18px 0 16px; background: #eeebe5; border-radius: 3px; position: relative;
          display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 0 22px; }
  .frame { padding: 16px; border-radius: 2px;
           background: linear-gradient(135deg, #8a6a2c 0%, #e2c47a 18%, #a8833c 38%, #f0d995 55%, #94722f 75%, #d4b366 100%);
           box-shadow: 0 14px 22px rgba(0,0,0,.28), 0 2px 5px rgba(0,0,0,.25); }
  .frame img { display: block; height: 5.55in; width: auto; box-shadow: 0 0 0 2px #4a3714; }

  .label { align-self: flex-end; margin: 18px 0.6in 0 0; width: 1.95in; background: #faf8f3; padding: 8px 10px 9px;
           box-shadow: 0 3px 8px rgba(0,0,0,.14); font-family: 'Cormorant Garamond', serif; font-size: 10px; line-height: 1.28; }
  .label .who { font-weight: 700; font-size: 12.5px; }
  .label .life { color: #6b655c; margin-bottom: 4px; }
  .label .ttl { font-style: italic; font-weight: 600; font-size: 11px; }
  .label .med { color: #6b655c; }
  .label .stop { margin-top: 5px; padding-top: 5px; border-top: 1px solid #e4dfd5; font-family: 'Inter', sans-serif;
                 font-size: 7.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #4a453d;
                 display: flex; align-items: center; gap: 6px; }
  .label .stop svg { width: 9px; height: 9px; }

  .try { display: flex; gap: 22px; align-items: flex-start; }
  .try h2 { margin: 0; flex: none; width: 1.45in; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 21px; line-height: 1.05; }
  .try ol { margin: 0; padding: 0; list-style: none; display: flex; gap: 18px; flex: 1; counter-reset: s; }
  .try li { flex: 1; font-size: 11.5px; line-height: 1.4; counter-increment: s; }
  .try li::before { content: counter(s); display: block; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px; line-height: 1; margin-bottom: 3px; color: #a8833c; }
  .try li b { font-weight: 700; }
  .foot { margin-top: 12px; padding-top: 8px; border-top: 1px solid #e4dfd5; display: flex; justify-content: space-between; font-size: 8.5px; color: #8a847a; }
</style>
</head>
<body>
<template id="stop">
  <section class="page">
    <div class="head"><span class="mark">Wren &amp; Alder</span><span class="show"><b>At Work</b><i>Artists and Their Subjects</i></span></div>
    <div class="wall">
      <div class="frame"><img alt=""></div>
      <div class="label">
        <div class="who"></div><div class="life"></div>
        <div class="ttl"></div><div class="med"></div>
        <div class="stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><span></span></div>
      </div>
    </div>
    <div class="try">
      <h2>Try the audio tour</h2>
      <ol>
        <li>On your phone, go to <b class="addr"></b></li>
        <li>Tap <b>Start</b>. Headphones on, or turn the sound up.</li>
        <li>Point your phone at the painting and listen.</li>
      </ol>
    </div>
    <div class="foot"><span>Wren &amp; Alder is a fictional gallery we made to demonstrate Popcode. Paintings: Art Institute of Chicago, public domain.</span><span>popcode.app/exhibitions</span></div>
  </section>
</template>
<script>
  // Filled in by build.mjs via ?addr=; the default is the planned slug.
  var ADDR = new URLSearchParams(location.search).get('addr') || 'popcode.app/wrenalder';
  var STOPS = [
    { img: '../../public/assets/exh-try-sargent.jpg', who: 'John Singer Sargent', life: 'American, 1856–1925',
      ttl: 'The Fountain, Villa Torlonia, Frascati, Italy', date: '1907', med: 'Oil on canvas' },
    { img: '../../public/assets/exh-try-degas.jpg', who: 'Edgar Degas', life: 'French, 1834–1917',
      ttl: 'Yellow Dancers (In the Wings)', date: '1874–76', med: 'Oil on canvas' },
    { img: '../../public/assets/exh-try-manet.jpg', who: 'Édouard Manet', life: 'French, 1832–1883',
      ttl: 'Woman Reading', date: '1880–82', med: 'Oil on canvas' }
  ];
  var tpl = document.getElementById('stop');
  STOPS.forEach(function (s, i) {
    var p = tpl.content.cloneNode(true);
    p.querySelector('img').src = s.img;
    p.querySelector('.who').textContent = s.who;
    p.querySelector('.life').textContent = s.life;
    p.querySelector('.ttl').textContent = s.ttl + ', ' + s.date;
    p.querySelector('.med').textContent = s.med;
    p.querySelector('.stop span').textContent = 'Audio stop ' + (i + 1) + ' of ' + STOPS.length;
    p.querySelector('.addr').textContent = ADDR;
    document.body.appendChild(p);
  });
</script>
</body>
</html>
